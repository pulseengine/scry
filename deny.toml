# cargo-deny configuration for scry.
# https://embarkstudios.github.io/cargo-deny/
#
# Copied from the witness/rivet pattern to match the PulseEngine
# family allowlist. Adjust as scry takes on new dependencies; any
# license not in `allow` below blocks the CI deny job.

[advisories]
# Vulnerabilities are denied by default in cargo-deny >=0.16.
# Yanked crates produce warnings by default.
ignore = [
    # RUSTSEC-2026-0204 — invalid pointer deref in `crossbeam-epoch`'s
    # `fmt::Pointer` impl for `Atomic`/`Shared` (only when printing an already-
    # invalid pointer). Enters the graph ONLY through `scry-host-tests` →
    # wasmtime → rayon → crossbeam-deque → crossbeam-epoch; it is in ZERO
    # published `scry-sai-*` libraries and not in the shipped `scry.wasm`. The
    # harness does not format crossbeam pointers. No impact on shipped crates or
    # the analyzer component.
    # RE-EVALUATED 2026-08-26 at the wasmtime 45 -> 47 bump (FEAT-078): this one
    # SURVIVED. wasmtime 47.0.4 still resolves crossbeam-epoch 0.9.18, so
    # cargo-deny continues to match the advisory. The other four ignores that
    # stood alongside it went stale at the same bump and were deleted. Do not
    # re-word this to "re-evaluate when wasmtime is bumped" — that has now been
    # done and did not clear it; it needs a rayon/crossbeam-deque bump, which
    # wasmtime 47 does not pull.
    "RUSTSEC-2026-0204",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
