# cargo-deny configuration for scry.
# https://embarkstudios.github.io/cargo-deny/
#
# Copied from the witness/rivet pattern to match the PulseEngine
# family allowlist. Adjust as scry takes on new dependencies; any
# license not in `allow` below blocks the CI deny job.

[advisories]
# Vulnerabilities are denied by default in cargo-deny >=0.16.
# Yanked crates produce warnings by default.
ignore = [
    # RUSTSEC-2026-0204 — invalid pointer deref in `crossbeam-epoch`'s
    # `fmt::Pointer` impl for `Atomic`/`Shared` (only when printing an already-
    # invalid pointer). Enters the graph ONLY through `scry-host-tests` →
    # wasmtime → rayon → crossbeam-deque → crossbeam-epoch; it is in ZERO
    # published `scry-sai-*` libraries and not in the shipped `scry.wasm`. The
    # harness does not format crossbeam pointers. No impact on shipped crates or
    # the analyzer component.
    # RE-EVALUATED 2026-08-26 at the wasmtime 45 -> 47 bump (FEAT-078): this one
    # SURVIVED. wasmtime 47.0.4 still resolves crossbeam-epoch 0.9.18, so
    # cargo-deny continues to match the advisory. The other four ignores that
    # stood alongside it went stale at the same bump and were deleted. Do not
    # re-word this to "re-evaluate when wasmtime is bumped" — that has now been
    # done and did not clear it; it needs a rayon/crossbeam-deque bump, which
    # wasmtime 47 does not pull.
    "RUSTSEC-2026-0204",
    # RUSTSEC-2026-0391 / -0398 / -0403 / -0410 — the zstd family: stream
    # encoder/decoder context reuse leaking the previous stream's input
    # (0391), `Seekable::decompress` setting a Vec length past its capacity
    # for an out-of-range offset (0398, needs the `seekable` feature),
    # uninitialized memory on a failed legacy-frame decompression (0403), and
    # the zstd-sys wasm32 allocator shim writing its size header to address 0
    # on allocation failure (0410). All four enter the graph ONLY through
    # scry-host-tests → wasmtime → wasmtime-internal-cache → zstd; that crate
    # is `publish = false` and is in ZERO published scry-sai-* libraries, and
    # the analyzer crates carry no wasmtime/zstd dependency, so the shipped
    # scry.wasm does not contain zstd-sys at all (0410's wasm32 shim never
    # compiles in). wasmtime-internal-cache compresses its cache blobs with
    # one-shot encode/decode — not the streaming `with_context` constructors
    # (0391), not the `seekable` feature (0398), and not legacy v0.4–v0.7
    # frames (0403). No reachable patched release exists yet: the fixes need
    # zstd >= 0.14.3 / zstd-safe >= 8.2.0, but wasmtime-internal-cache 48.0.7
    # pins zstd ^0.13, so clearing them needs a wasmtime 49+ bump, which is a
    # separate decision from this PR. RE-EVALUATED 2026-10-26 when the
    # advisories landed in the DB (published 2026-10-26T13:45Z; main's last
    # green deny run predates them).
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0410",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
