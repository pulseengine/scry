# v3.2.7 — filed in its own file per scry#143 fix (1).
artifacts:
  - id: FEAT-083
    type: feature
    title: "v3.2.7 — The shipped component reports its real version (scry#152)"
    status: accepted
    release: v3.2.7
    description: >
      Found by running the SHIPPED v3.2.6 artifact minutes after cutting it.
      The component announced `scry 0.0.0` — not 3.2.6, and not the 3.2.4 that
      scry#133 was about.

      MECHANISM. FEAT-076 replaced a hand-maintained literal with
      `env!("CARGO_PKG_VERSION")`, which is correct under cargo. The shipped
      component is built by BAZEL, and rules_rust populates CARGO_PKG_VERSION
      from the target's `version` attribute, defaulting it to "0.0.0". No
      `crates/*/BUILD.bazel` set one. So the fix was right in the build nobody
      ships and wrong in the build everybody consumes.

      THE OTHER HALF, and the more instructive one: the test written for
      scry#133 could not catch this. It asserted
      `assert_eq!(SCRY_VERSION, env!("CARGO_PKG_VERSION"))` where SCRY_VERSION
      IS that expression — tautological, unable to fail under any build.

      It was NOT vacuous when written. Red-first it failed honestly with
      left "3.2.4" / right "3.2.5", because SCRY_VERSION was still a literal.
      It became vacuous the moment the fix landed, because the fix makes the
      asserted identity true by construction. This is a vacuity class the
      project's mutation-check discipline does not cover: reverting the
      implementation to a literal makes such a test fail, which looks like a
      healthy oracle, while the passing state carries no information at all.
      A test can be meaningful before a change and worthless after it.

      FIX, in two parts that are deliberately separate. (1) Set `version` on the
      Bazel target so CARGO_PKG_VERSION matches the workspace under both builds.
      (2) Replace the tautology with `assert_ne!(SCRY_VERSION, "0.0.0")`, which
      names the rules_rust default explicitly and CAN fail.

      The hard-coded Bazel literal recreates exactly the drift FEAT-076 set out
      to end — Bazel cannot read Cargo.toml — so it is GATED rather than
      trusted: claims.yaml pins it to the workspace version and forbids the
      "0.0.0" default returning in any crate. A number maintained by hand is
      acceptable only when something mechanical notices when it stops being
      maintained.

      HONESTY NOTE carried forward: v3.2.6's CHANGELOG says FEAT-076 fixed the
      component misreporting its version. It did not — it changed HOW it
      misreports. That is recorded on scry#152 and on the closed scry#133
      rather than left for a consumer to discover from the artifact.
    tags: [release-machinery, honesty, vacuous-oracle, bazel, v3.2.7]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given the Bazel-built component, When it emits its version diagnostic, Then the string is the workspace version and never the rules_rust default. RED-FIRST EVIDENCE from the shipped artifact: the v3.2.6 wasm contains the byte string `0.0.0` and does NOT contain `3.2.6`."
        - "Given the unit test for this, When SCRY_VERSION is forced to the default, Then it FAILS. Verified: `assert_ne!` fires with the rules_rust message. The assertion it replaces could not fail under any build."
        - "Given claims.yaml, When the Bazel literal drifts from the workspace version OR any crate reverts to the 0.0.0 default, Then claim-check goes red. MUTATION-CHECKED both directions: drift -> red, default -> red, restored -> 7/7."
        - "DISCHARGED after the fact, on the real artifact: the CI-built scry.wasm from main 9c0f913 contains `3.2.6` and NOT `0.0.0`, while the SHIPPED v3.2.6 component (built before the fix) contains `0.0.0` and not `3.2.6` — a clean inversion on two real binaries."
        - "Given the built component, When CI runs, Then a step FAILS if the wasm lacks the workspace version or contains the rules_rust `0.0.0` default. This is the only guard on the ARTIFACT — the unit test and the claims.yaml pin both guard the SOURCE, and the Bazel rust_test target is still not invoked by any workflow. The check uses `grep -a`: without it, grep reports no-match on a binary for a string that IS present, silently and inconsistently between BSD and GNU. Verified against both real artifacts — the version without `-a` failed the fixed AND the broken component, i.e. it was vacuous."
    links:
      - type: traces-to
        target: REQ-017

  - id: FEAT-086
    type: feature
    title: "v3.2.7 — Clippy covers every crate, and the coverage guard covers BOTH gates (scry#157)"
    status: accepted
    release: v3.2.7
    description: >
      FILED AFTER THE FACT, and that is itself the first thing to record: the
      implementation merged as PR #159 with a commit and PR titled
      "FEAT-086 (scry#157)" while NO SUCH ARTIFACT EXISTED. Untracked work — the
      anti-pattern the issue-hunt skill names explicitly, because it is invisible
      to the release plan and resurfaces as a gate surprise. `rivet validate`
      cannot catch it: it validates artifacts that exist, not references to ones
      that do not.

      THE DEFECT. CI's Clippy job ran FOUR packages — the same four the Test job
      ran before scry#141 widened it. Nine publishable crates were never linted,
      and TWO had live errors on main that CI could not see: scry-sai-bits (a doc
      line beginning `> 2^63`, read as an unterminated Markdown blockquote) and
      scry-sai-pentagon (two needless borrows, in its own meet/leq soundness
      tests). Both fixed.

      THE REAL DELIVERABLE IS THE GUARD, and it took four attempts. The version
      merged with scry#141 asserted coverage for `cargo test` ONLY, so when the
      clippy list stayed narrow it said nothing. Widening one gate did not fix
      the pattern — the two per-package lists sit three lines apart and drifted
      independently.

      Three text-scraping attempts were VACUOUS in ways that looked like they
      worked: a per-crate dynamic regex (survived BSD grep, failed GNU grep, then
      failed CLOSED naming all twelve); an `awk` line-range that CHAINED across
      the whole file so the two lists came out IDENTICAL — a guard that could not
      detect the drift it exists for, and which printed "FIRES" under mutation
      with the WRONG attribution; and, earlier and elsewhere, a predicate that
      counted a comment as a gate (scry#147).

      Replaced with tools/check-gate-coverage.py, which parses the workflow as
      YAML and attributes packages per step. It carries `--self-test` asserting
      it distinguishes a good workflow from a bad one — including the property
      the awk version failed, that the two gates are not identical — and CI runs
      that self-test BEFORE the real check, so a checker that stops
      discriminating fails the build rather than passing quietly.
    tags: [ci, gate-potency, honesty, issue-driven, v3.2.7]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given the CI Clippy job, When it runs, Then every publishable crate is linted. VERIFIED IN CI, not merely locally: the step `cargo clippy — analyzer core, viz, and the domain crates` reports success on the run for PR #159, alongside the four original per-package steps."
        - "Given a crate missing from EITHER gate, When the guard runs, Then it fails naming the crate AND which gate. MUTATION-CHECKED against the real workflow in both directions: dropping scry-sai-float from clippy alone yields `scry-sai-float(clippy)`; dropping scry-sai-poly from test alone yields `scry-sai-poly(test)`. Correct attribution — which the previous awk version got wrong."
        - "Given the checker itself, When CI runs it, Then `--self-test` executes FIRST and asserts the checker can distinguish a good workflow from a bad one. A gate that cannot fail is the defect this feature exists to fix, so the gate on the gate is not optional."
        - "Given main after the merge, Then scry-sai-bits and scry-sai-pentagon both lint clean — the two crates that carried live errors CI could not see."
      residual: >
        A commit or PR referencing a rivet id that does not exist is undetectable
        today; this artifact exists because I noticed by hand. Worth a
        `rivet`-side check that ids named in commit trailers resolve.
    links:
      - type: traces-to
        target: REQ-001
