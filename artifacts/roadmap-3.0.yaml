  # ══════════════════════════════════════════════════════════════════════
  # RELEASE v3.2.5 — "Do not trap the host" (patch, issue-driven)
  # Cut ahead of v3.3.0 rather than folded into it: scry#125 is a crash in the
  # RELEASED 3.2.4 that traps the guest, so a consumer is blocked TODAY and
  # v3.3.0's scope is nowhere near closed. A single high-value fix is allowed
  # to be its own release.
  # ══════════════════════════════════════════════════════════════════════

  - id: FEAT-074
    type: feature
    title: "v3.2.5 — A branch to the function label must not panic (scry#125)"
    status: accepted
    release: v3.2.5
    description: >
      `analyze` PANICKED with "index out of bounds: the len is 0 but the index
      is 0" on valid, tiny modules from the official WebAssembly test suite —
      reported by avrabe (scry#125) after running the released
      scry-3.2.4-wasm32-wasip2.wasm over a 468-module real-world corpus, where
      2 of 281 analysed modules crashed deterministically.

      WHY A PANIC IS WORSE THAN AN ERROR HERE. The WIT signature is
      `analyze: func(...) -> result<analysis-result, analyze-error>`, and
      `analyze-error` exists precisely so an unanalysable module gets a
      STRUCTURED refusal. A panic inside the component traps the guest, so the
      host receives NEITHER arm of the result. The interface's own channel for
      "I could not analyse this" is bypassed, and a consumer cannot distinguish
      "scry declined" from "scry died".

      ROOT CAUSE. `Interp::target()` resolves a branch's label with
      `labels.len().saturating_sub(1 + relative_depth)` and then INDEXES. The
      label stack is pushed only on ENTERING a block/loop/if, so the function
      body's own implicit label is never on it — and a branch at function top
      level (`br 0` with no enclosing region) indexes an empty slice.
      `saturating_sub` guards `relative_depth >= n` but not `n == 0`.

      SECOND DEFECT IN THE SAME LINE. The clamp was also wrong when it did NOT
      panic: a branch that exits the function from inside a region (`(block br 1)`)
      was clamped to index 0 and recorded the function-exit state into the
      OUTERMOST region's label — a state that never arrives there. Over-approximate
      and therefore sound, but attributed to the wrong label. `checked_sub` fixes
      both: past every enclosing region means the function label, which is a
      RETURN with no in-function successor to carry state to.

      NOT A GAP. Returning `None` records nothing, and that is not an
      unsoundness fallback: a return is fully modelled. Emitting a gap here
      would inflate the gap report with an ordinary construct and make
      REQ-017's "no silent top" surface less readable, not more.
    tags: [robustness, crash, spec-suite, issue-driven, v3.2.5]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given a module whose function branches to the function label (`br 0` / `br_if 0` at top level, or `br 1` out of a single block), When analyze runs, Then it returns normally instead of panicking."
        - "Given the two spec-suite sources the reporter named — test/core/func.wast and test/core/unwind.wast — When their first modules are analysed, Then neither traps. MEASURED before/after on the real sources: both PANICKED at HEAD; after the fix unwind.wast analyses cleanly (49 functions, 100 program points) and func.wast returns a STRUCTURED Internal error rather than a trap."
        - "Given the fix, When the existing suite runs, Then no analyzer test regresses — the change alters which label a function-exiting branch records into, so a silent precision or soundness regression must be excluded rather than assumed. MEASURED, because a unit suite of small fixtures is exactly where this would NOT show: the same 8.2 MB compiler-emitted module was analysed by the pre-fix and post-fix analyzer and the results are identical — 8530 advisories, 6490 trap checks, 28 proven-safe, 6462 potential-trap, and the same class breakdown (6463 unproven-obligation / 2039 precision-gap / 28 leverageable-fact). The AC is met on real code, not merely un-contradicted by fixtures."
        - "REGRESSION ORACLE, written RED FIRST: issue125_branch_to_the_function_label_does_not_panic reproduced the reporter's exact message (`index out of bounds: the len is 0 but the index is 0`) at the same site from a one-line module BEFORE the fix, and covers every branch form that resolves a label — a fix guarding only `br` would leave `br_if` live."
      residual: >
        Fixing the panic UNMASKED a separate, pre-existing defect that the crash
        was hiding: func.wast now reports `Internal("func 90 pc 7: i32 binop
        with single operand")`. That is an operand-stack modelling defect, not a
        crash, and it is filed separately rather than folded in here. Two
        hypotheses were tested and REFUTED (a polymorphic stack after `br`, and
        after `unreachable` — both analyse cleanly in isolation), so its cause is
        recorded as uncharacterised rather than guessed at.
    links:
      - type: traces-to
        target: REQ-001
      - type: traces-to
        target: REQ-017

  - id: FEAT-075
    type: feature
    title: "v3.2.5 — Every unsoundness fallback names its operator (scry#126)"
    status: accepted
    release: v3.2.5
    description: >
      In avrabe's real-world corpus run (scry#126) the LARGEST bucket of
      fallback diagnostics was not an operator at all: 579 of them said only
      `<unsupported>`, more than any named operator including `i32.and` (433).
      A consumer was told THAT analysis degraded but not WHAT caused it — the
      diagnostic is non-actionable in exactly the case it exists for, and the
      operator ranking that makes the precision work prioritisable had to be
      reconstructed from outside rather than read off scry's own output.

      ROOT CAUSE, and it is embarrassing in the useful way: the fix already
      existed. `op_report_name()` falls back to the operator's Debug variant
      name precisely so an unsupported op is still identified, and it was
      already wired into the GAP records. The fallback DIAGNOSTIC used the
      lower-level `op_name()`, which returns the literal `<unsupported>` for
      anything outside its short hardcoded list. So the two surfaces disagreed
      about the same event at the same pc: the gap named the operator and the
      diagnostic did not.

      This is a REQ-017 defect, not merely cosmetic. "No silent top" is not met
      by a record that announces a degradation without identifying its cause —
      an unnameable fallback is only marginally better than silence, and it is
      worse than silence for an agent, which cannot ask a follow-up question.
    tags: [diagnostics, observability, issue-driven, honesty, v3.2.5]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given a module containing an unmodelled operator, When analysis emits ANY diagnostic naming that operator, Then the message names it and never contains the literal `<unsupported>`. Scoped to ALL sites, not just the reported one: after fixing the interpreter's fallback, every `op_name` call site was grepped rather than assumed. A SECOND defective site was found — the taint pass has its own 'operator not modelled' diagnostic whose TRIGGER is an unmodelled operator, so it printed the placeholder for exactly the population it describes. A third site (the write-set-havoc Info) is safe, because `op_name` does cover `block`/`loop`/`if`."
        - "Given the same site, When a consumer correlates the diagnostic with the gap record, Then both name the SAME operator — the surfaces may not disagree about one event."
        - "MUTATION-CHECKED: reverting the one-word change reproduces the reporter's exact string, `unsupported operator at v0.2 AC#1: <unsupported> — locals degraded to top`, so the oracle is known to test the fix rather than the fixture."
        - "NON-VACUITY, learned the hard way: the first version of this test used AnalysisConfig::default(), where emit_diagnostics is FALSE, so it asserted on an empty diagnostic set and would have passed against no fix at all. The second version asserted on the wrong operator — `f64.const` is itself unmodelled and takes the fallback first, and only ONE fallback fires per function. The fixture now makes the operator under test the only unmodelled one."
      residual: >
        This names the operators; it does not MODEL any of them. avrabe's
        ranking (nop/drop/unreachable 215, the bitwise/shift family 597,
        select 203) is the actual precision work and is not in this release.
        What changes here is that the ranking becomes readable from scry's own
        output instead of reconstructed by a third party.
    links:
      - type: traces-to
        target: REQ-017
      - type: traces-to
        target: REQ-001

  # ══════════════════════════════════════════════════════════════════════
  # RELEASE v3.2.6 — "The release machinery holds itself to the standard"
  # Accumulating. Both items are defects in OUR OWN tooling found while
  # shipping v3.2.5, and both are the failure mode this project spends its
  # time arguing against: a thing that reports success while doing nothing.
  # ══════════════════════════════════════════════════════════════════════

  - id: FEAT-076
    type: feature
    title: "v3.2.6 — The release machinery stops failing silently (scry#132, #133)"
    status: accepted
    release: v3.2.6
    description: >
      Two defects found by inspecting what v3.2.5 ACTUALLY shipped rather than
      what CI said about it. Neither was caught by a gate, because both live in
      places no gate looks.

      scry#133 — SCRY_VERSION WAS A HAND-MAINTAINED LITERAL. The v3.2.5 bump
      moved the workspace version and all 11 inter-crate pins; a `const
      SCRY_VERSION: &str = "3.2.4"` was invisible to that sweep, so the shipped
      3.2.5 component emitted `"scry 3.2.4 — ..."` in its own diagnostics.
      Consumers identify the producing analyzer from that string, and BOTH
      issues fixed in v3.2.5 were reported against a specific released version —
      a component that misidentifies itself sends the next report to the wrong
      build. Now `env!("CARGO_PKG_VERSION")`: derived, not maintained.
      This is the drift class claims.yaml gates (#97) — but that gate reads
      DOCS, and cannot see a Rust string literal. Deriving the value is what
      closes it; the test only keeps it derived.

      scry#132 — THE DELTA VIEW NEVER RENDERED, AND SAID NOTHING. FEAT-072's
      release-over-release page 404'd on v3.2.5. Two compounding causes: the
      publish-pages job checks out WITHOUT `fetch-depth: 0`, so no tags exist;
      and `grep -v` exits 1 on empty input under GitHub's default `bash -e`
      shell, which `set -uo pipefail` does NOT disable — so the step aborted on
      the `PREV=` line, BEFORE the "no previous tag" message it was written to
      print. Reproduced mechanically rather than assumed: `bash -e -c 'set -uo
      pipefail; X="$(echo -n "" | grep -v "^v9$")"; echo reached'` exits 1 with
      no output; adding `|| true` reaches the echo.

      THE SHARED LESSON, and why these ship together. I wrote
      `continue-on-error` and `|| exit 0` guards specifically so a missing
      previous tag would degrade gracefully instead of blocking a release. What
      they produced was a SILENT failure: green job, shipped release, missing
      page, nothing anywhere saying the feature had not run. That is the same
      defect class as scry#126's `<unsupported>` fallback — announcing a
      degradation without identifying it — and it violates DD-022's own rule
      that observation modes be properties of the code rather than conventions.
      The rule was applied to the analyzer and broken in the release machinery
      in the same session.
    tags: [release-machinery, honesty, observability, issue-driven, v3.2.6]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given any build of scry-sai-core, When it reports its version in a diagnostic, Then the string equals the crate's package version — asserted by issue133_scry_version_is_derived_from_the_package_version, which was RED before the fix (left \"3.2.4\", right \"3.2.5\")."
        - "Given the publish-pages job, When it runs, Then it has the git history the delta view needs (`fetch-depth: 0`), and EVERY exit path of the delta step prints a `DELTA-STEP:` line stating OK / SKIPPED-with-reason / FAILED. A continue-on-error step that produces no output must be treated as a defect, not as a skip."
        - "Given the release delta step's exact shell run against two REAL tags, When it executes, Then it resolves the previous tag, builds it, renders, and prints a DELTA-STEP status line naming the outcome. DISCHARGED by dry-run 2026-08-26: `VERSION=v3.2.5` resolved `v3.2.4`, rendered 7696 -> 8027 sites, wrote dist/delta.html (28749 bytes), and printed `DELTA-STEP: OK`. Also verified `fetch-depth: 0` is present on the publish-pages checkout, which is the condition the step needs and the one whose absence caused the original silent failure."
        - "Given that same real render, When the DD-022 constraint is checked, Then the page contains no `discharg`/`verified fix`/`obligation closed`, carries the scoped `ordinal-stable` headline, cites scry#122, and discloses that ordinal-stability is not a certificate. All six verified on the v3.2.4 -> v3.2.5 render, not on a fixture."
        - "SUPERSEDES an earlier AC that read 'Given the next release, When it completes, Then delta.html returns 200' and was marked NOT YET VERIFIABLE. That created a DEADLOCK: FEAT-076 is scoped to v3.2.6, so the release could not become cuttable until the feature was verified, and the feature could not be verified until the release shipped. Running the step's own shell against real tags is both dischargeable now AND stronger evidence, because it exercises the exact logic rather than waiting to observe its effect."
      residual: >
        scry#130 — main has NO required_status_checks, so the CI gate is
        advisory rather than enforced. That is the root reason a silently broken
        step could ship: nothing structural stops a red or vacuous check. It
        needs repo-admin rights and is deliberately NOT bundled here.
    links:
      - type: traces-to
        target: REQ-017

  - id: FEAT-077
    type: feature
    title: "v3.4 — Two-tier function identity: unique stripped name, else raw name marked build-local (scry#123)"
    status: accepted
    release: v3.4.0
    description: >
      The repair for the MEASURED identity-churn defect (scry#123, FEAT-073's
      first run): `func_ident` — the FIRST component hashed into
      `obligation_id` / `site_key` / `group_key` — inherited Rust legacy
      mangling's trailing `17h<16 hex>E` symbol disambiguator, which derives
      from crate metadata and instantiation, NOT the function body. Measured on
      real builds of scry_mcdc.wasm: raw-name survival across an UNRELATED
      one-commit edit was 54.8%, and across an edit to a function's OWN body
      54.9% — the identity was destroyed by the very edit it exists to survive.
      Stripping the suffix is 100% stable on ground-truth-paired functions but
      makes 37.8% of functions share a stripped name (max multiplicity 39) —
      ALL of them dependency generics; ZERO of scry's own functions collide.
      Neither tier alone is acceptable, so the identity is TWO-TIER and honest
      about which tier it used:
        1. the stripped name, IF unique within the module (stable across
           builds — the common case, and every scry-own function);
        2. otherwise today's raw name (unique within one build), with the
           advisory MARKED `id_build_local: true` — its identity keys are NOT
           comparable across builds, and a consumer can tell WITHOUT parsing
           the id.
      Only the exact shape `17h` + 16 lowercase hex + `E` is stripped; the
      uniqueness check counts stripped AND plain candidates, so a stripped name
      landing on an existing plain name is also rejected. Names with no
      disambiguator, export-derived names, and the body-shape-hash fallback are
      byte-identical to v3.2.5 (regression-pinned against ids captured from the
      unmodified code). Surfaced end-to-end: `Advisory.id_build_local`,
      guidance feed v3 (`id_build_local` on every advisory), an HTML
      "build-local id" badge, and the FEAT-072 delta view (per-row
      `build_local`, a summary count, and a disclosure that such rows are
      expected churn, not evidence a site came or went).
    tags: [ai-agent, identity, fix-verify-loop, issue-driven, honesty, v3.4]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given two builds whose function names differ ONLY in the `17h<16 hex>E` disambiguator (the measured churn), When the stripped name is unique within the module, Then every obligation id in that function is unchanged and NOT marked build-local. RED-FIRST: on the unmodified code this failed with ids 848ca91acb777c5d != 542c78e69e6c2622."
        - "Given two functions whose names differ only in the disambiguator (two monomorphizations of one generic, identical bodies), When identities are stamped, Then they do NOT collapse onto one identity — the raw name keeps them apart within the build — and BOTH are marked `id_build_local: true`."
        - "Given a stripped name that collides with another function's PLAIN name (`foo17h…E` vs `foo`), When identities are stamped, Then the disambiguated function falls back to its raw name marked build-local and the plain-named function keeps its stable identity — uniqueness is counted over stripped AND plain candidates."
        - "Given a name whose suffix is a NEAR MISS (uppercase hex, or 15 digits), When identities are stamped, Then nothing is stripped: the id tracks the raw name exactly as in v3.2.5 and is not marked. MUTATION-CHECKED: widening the shape to accept uppercase hex turns exactly this test red."
        - "Given a plain name (`compute`) or an unnamed function (body-shape-hash fallback), When identities are stamped, Then the obligation id is BYTE-IDENTICAL to v3.2.5 — pinned against constants (dd7c4231ce161f87 / 4f61c85b63648dc7) captured from the unmodified code on main (5cd2a89) before the change."
        - "Given the guidance feed, When rendered, Then `guidance_schema` is AT LEAST 3 — exactly 3 when this shipped, and later features have bumped it further (FEAT-087, FEAT-090). The claim is the FIELD's presence and a monotonic version, NOT any particular number: an AC that names the current number has to be edited on every unrelated bump and silently goes stale when it is not — and every advisory carries `id_build_local` — a consumer can tell a stable id from a build-local one without parsing the id (FEAT-068 versioning discipline). The delta view carries the flag per row plus a summary count, and its page discloses that a build-local site vanishing/appearing between builds is expected churn."
        - "MUTATION-CHECKED, five mutants all killed by exactly the intended tests and nothing else: (M1) stripping disabled -> 3 core tests red; (M2) uniqueness check dropped -> the two collision tests red; (M3) uppercase hex accepted -> the exact-shape test red; (M4) marking suppressed -> 2 core + all 3 viz tests red; (M5) everything marked -> 5 core + 3 viz tests red."
      residual: >
        Build-local identities remain build-local: for the ~37.8% of functions
        (all dependency generics) sharing a stripped name there is still no
        cross-build identity — a stable identity there needs the stable name
        PLUS instantiation disambiguation, which is its own design decision
        (noted in scry#123). The marking makes the limitation visible instead
        of letting a consumer diff churn. The delta view treats such rows as
        non-evidence; the FEAT-065 adjudicator (REQ-021) must treat a
        build-local identity as at most `uncertain`. Measured collision figures
        are from scry's own binary; other corpora may differ in degree, not in
