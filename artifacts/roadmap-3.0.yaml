  - id: FEAT-078
    type: feature
    title: "v3.2.6 — wasmtime 45 -> 47: four of five standing advisory ignores go stale (scry#116)"
    status: accepted
    release: v3.2.6
    description: >
      PR #115 added a time-boxed `deny.toml` ignore for RUSTSEC-2026-0222
      (wasmtime "stores can mix up type indices between engines") whose own
      comment said it should be DELETED at the next wasmtime bump, not carried
      forward. This is that bump.

      MEASURED, WITH A CONTROL — the result is better than scry#116 anticipated.
      On main at wasmtime 45.0.0, `cargo deny check advisories` reports ZERO
      stale ignores: all five are live, each suppressing a real advisory. At
      wasmtime 47.0.4, FOUR report `advisory-not-detected`:
      RUSTSEC-2026-0182 (wasmtime WASIp1 fd_renumber leak), -0188 (wasmtime-wasi
      FilePerms bypass), -0190 (anyhow downcast_mut unsoundness), and -0222 (the
      target). All four deleted with their rationale comments.

      The control is the load-bearing part: it distinguishes "the bump cleared
      these" from "these were already stale and nobody noticed", and only the
      first is a claim this feature can make.

      RUSTSEC-2026-0204 (crossbeam-epoch `fmt::Pointer` invalid deref) SURVIVED —
      wasmtime 47.0.4 still resolves crossbeam-epoch 0.9.18. Its comment said
      "re-evaluate when wasmtime/rayon are bumped"; that has now been done for
      wasmtime and did NOT clear it, so the comment is corrected in place to say
      what would: a rayon / crossbeam-deque bump, which wasmtime 47 does not pull.

      NO API CHURN. scry#116 anticipated "fix harness API churn across two
      majors"; there was none — `scry-host-tests` compiles unmodified.

      TOOLING NOTE. The installed cargo-deny 0.16.4 could not parse the current
      advisory database at all (`unsupported CVSS version: 4.0`), so the
      stale-ignore question was unanswerable until it was updated to 0.20.2. A
      verifier that cannot load its own database fails OPEN if its output is
      skimmed rather than read.
    tags: [dependencies, security, hygiene, issue-driven, v3.2.6]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given the workspace at wasmtime 47, When `cargo deny check advisories` runs, Then it reports `advisories ok` with NO `advisory-not-detected` warning — every remaining ignore suppresses a live advisory."
        - "Given the same check on main at wasmtime 45 (the control), Then zero ignores are stale — establishing that the bump cleared the four, rather than their having been stale already."
        - "Given `cargo test -p scry-host-tests` on wasmtime 47, Then the harness passes unmodified: 32 pass; the single failure is `feat013_live_analyze_gate`, which names its own precondition (composed component missing at bazel-bin/scry.wasm) and is environmental, not an API regression."
        - "Given deny.toml after this change, Then exactly one ignore remains and its comment states what was re-evaluated and what would actually clear it — not a re-worded version of the check already performed."

  - id: FEAT-080
    type: feature
    title: "v3.2.6 — CI actually runs the analyzer's tests, and a guard keeps it that way (scry#141)"
    status: accepted
    release: v3.2.6
    description: >
      The CI Test job ran `cargo test` on FOUR packages. `scry-sai-core` — the
      analyzer itself — was not one of them. Measured across the workspace:
      222 of 273 tests (81%) never executed in CI.

      Nine of twelve published crates were uncovered, and with them the entire
      interpreter, the fixpoint, guard refinement, obligation identity, advisory
      classification, eight of ten abstract domains, all of scry-viz — and every
      regression oracle recently added for scry#121, #123, #125 and #126. Those
      were written red-first and mutation-checked, and not one of them could
      have failed a build.

      The Bazel `rust_test(name = "scry_analyze_core_test")` target existed but
      no workflow invoked it; the only `bazel test` calls are //proofs/rocq/...
      and //proofs/verus/....

      WHAT A GREEN CHECK ACTUALLY MEANT: "host-tests, provenance, taint and
      octagon pass." Not "the analyzer works." Combined with scry#130 (main has
      no required_status_checks, so the gate is advisory anyway), a change could
      break every analyzer test and merge on a green board. Claims made elsewhere
      on the strength of "CI is green" — including the qualification dossier's
      CI-gate citations — need re-reading against what CI actually ran.

      TWO PARTS, because fixing it once is not enough. (1) Add the nine missing
      packages. (2) GATE THE GATE: a step that fails, naming the crate, if any
      publishable crate in crates/ is absent from a `cargo test` invocation.
      Listed explicitly rather than `--workspace` because the workspace holds
      wasm32 cdylib members a host-target `cargo test` cannot build (the reason
      PR #41 set default-members); the guard is what makes "explicit" safe, by
      making omission loud instead of silent.

      HOW IT WAS FOUND, because the method transfers: incidentally, while wiring
      `verification` artifacts for the dev V-model and needing to cite a CI job
      as evidence for each requirement. No job could be found that ran the tests
      the citation wanted. Asking "what gate proves this?" per requirement is
      what surfaced the missing gate — the traceability exercise doing its job
      rather than a coverage number being chased.
    tags: [ci, gate-potency, honesty, issue-driven, v3.2.6]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given the CI Test job, When it runs, Then every publishable crate in crates/ is exercised by a `cargo test` invocation. DISCHARGED IN CI on main d295fd8, not merely locally: the guard step printed `OK — every publishable crate appears in a cargo test invocation`, the new step ran `cargo test -p scry-sai-core -p scry-sai-viz -p scry-sai-interval ...`, and the job executed 322 tests against the 51 it ran before."
        - "Given a publishable crate absent from every `cargo test` step, When the guard runs, Then the job FAILS and names that crate. MUTATION-CHECKED: removing `-p scry-sai-bits` makes it fire with `missing: scry-sai-bits`; restoring it clears. A guard that cannot fail would be the same defect one level up."
        - "Given the explicit package list, Then it is deliberately not `--workspace`: the workspace holds wasm32 cdylib members a host `cargo test` cannot build. The guard is what makes the explicit list safe."
    links:
      - type: traces-to
        target: REQ-001
  - id: FEAT-079
    type: feature
    title: "v3.2.6 — Every havoc'd region records a gap: close the laundering hole (scry#121)"
    status: accepted
    release: v3.2.6
    description: >
      `havoc_region` never interprets the region body, yet it recorded a gap ONLY
      when the write set was non-empty or the region contained a call. A typed
      region that writes no local and calls nothing therefore vanished with NO
      record of any kind — no trap check, no gap, no advisory.

      Reproduced exactly as filed: `(block (result i32) i32.const 10 local.get 0
      i32.div_s)` yields an empty report, while the same expression unwrapped
      reports a div-by-zero POTENTIAL-TRAP. A typed `if` behaves identically.

      THREE CONSEQUENCES, and only the first is about precision.
      (1) The gap report was not complete: an assessor reading `gaps` as the
      scope boundary got a region that was never analysed and never disclosed.
      (2) It was a ONE-LINE LAUNDERING VECTOR — wrapping a flagged expression in
      a typed block removed it from the report entirely, requiring no
      understanding of any internal scheme.
      (3) It promoted to a WRONG VERDICT downstream: the adjudicator reads
      "absent from the after-run" as `removed-with-code` — literally "the site no
      longer exists" — while the code is still there and the obligation live
      (DD-021 finding 3).

      This is a hole in REQ-017's invariant, not merely a missing record. Here
      the analyzer is MAXIMALLY conservative — it interprets nothing — and says
      nothing at all, which is the one thing that invariant forbids.

      FIX: emit the gap unconditionally. The old gate's call half was added
      correctly (FEAT-043: a void call inside an `if` must still record, or
      `resolved_stack_callees` silently under-counts), but the lesson
      generalises — the reason to record is that the region WAS NOT ANALYSED,
      not that it happened to write a local. An empty write set makes a region
      cheaper to havoc, not more analysed.

      MEASURED IMPACT on scry's own compiled module: gaps 2046 -> 2100. Those 54
      regions were always being havoc'd; they were simply not disclosed. The
      dashboard number rising is VISIBILITY, not a regression, and the release
      note should say so before someone reads it as one.
    tags: [soundness-honesty, gap-reporting, laundering, issue-driven, v3.2.6]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given a typed region with an EMPTY write set and no call, When scry havocs it, Then a Gap{kind: UnmodeledControlFlow} is recorded — for `block` and for `if` alike."
        - "CONTROL, asserted first in the same test: the unwrapped expression raises a trap check. Without it the laundering test proves nothing, since an empty report would satisfy it either way."
        - "Given scry's own module, When gaps are counted before and after, Then the count rises 2046 -> 2100 — measured on the same module with both binaries, so the change is attributable to this fix rather than to module drift."
        - "Given claims.yaml, Then no claim predicate is bound to a gap count, so the increase breaks no gated claim — checked rather than assumed."
    links:
      - type: traces-to
        target: REQ-017
      - type: traces-to
        target: REQ-001
