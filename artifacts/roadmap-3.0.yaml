  # ══════════════════════════════════════════════════════════════════════
  # RELEASE v3.3.0 — "Agent-citable"  (REQ-020)
  # RE-SCOPED 2026-08-20. Was "Agent-verifiable" and carried BOTH halves of the
  # fix-verify loop. The adjudication half was refuted in review before it
  # shipped (scry#122) and moved to v3.4.0 with the new REQ-021. What remains
  # here is verifiable on its own: an obligation an agent can CITE, surfaces it
  # can reach, and the precision that makes the citations worth having.
  # Read-out from Wasm Research Day (6 Aug 2026): the AI-consumer axis is the
  # decisive one. Two halves, deliberately paired:
  #   DEPTH   — identity that survives the edit, MADE VISIBLE (anchors, delta
  #             view) and EXERCISED ON OURSELVES (self-adjudication harness,
  #             observation mode). The gate itself follows in v3.4.0.
  #   BREADTH — make the analysis reachable and askable by an agent at all
  #             (MCP surface, queries, versioned schema, manifest), plus the
  #             precision work that makes 6,191 obligations actionable.
  # Thesis: for an AI consumer, precision IS the product — an unproven
  # obligation is a bill for the analyzer's imprecision handed to the user.
  # ══════════════════════════════════════════════════════════════════════

  # ── DEPTH: the spine ──────────────────────────────────────────────────

  - id: FEAT-064
    type: feature
    title: "v3.3 — Stable obligation identity (survives the edit)"
    status: proposed
    release: v3.3.0
    description: >
      Replace raw `(func_index, pc)` as the EXTERNAL key for every finding with a
      content-addressed obligation ID (DD-020). Composed of: function identity
      (name-section name → export name → a hash of the body's shape, in that
      order of preference), a structural path through the CFG (block/loop nesting
      indices, not raw pcs), the operator kind, and the operator's index within
      its own basic block. Result: the ID is invariant under edits elsewhere in
      the module AND elsewhere in the same function, so a fix in one place does
      not renumber every obligation in the binary.
      `(func_index, pc)` stays in the output as a positional convenience; the ID
      becomes the thing consumers key on.
      Soundness/mechanization scope: the provable property is directional —
      `id(a) == id(b)` implies a and b denote the same structural site. The
      converse does NOT hold (a rewritten function legitimately produces new
      IDs) and must not be claimed.
    tags: [ai-agent, identity, fix-verify-loop, v3.3]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given a module and an edit that changes code in an unrelated function, When scry re-analyzes, Then every obligation ID outside the edited function is unchanged. FALSIFIED IN PRACTICE on Rust-produced modules (measured 2026-08-20 by FEAT-073, scry#123) — holds only for functions whose name-section name is itself stable. It is met by the unit fixture and NOT met by real toolchain output; see the AC below, which states what was measured. REPAIR: FEAT-077 (v3.4.0) makes the identity two-tier — the disambiguator-stripped name when unique in the module (measured 100% stable across both edit kinds), else the raw name explicitly marked `id_build_local` — so this AC holds for uniquely-named functions (every scry-own function in the measurement) and degrades HONESTLY, not silently, for the rest."
        - "MEASURED, not assumed (FEAT-073 over scry's own history, commits 582cfb06→524b3e0b). Given two builds of the same Rust source differing by an unrelated edit, When identities are compared, Then 334 of 744 functions carrying advisories (45%) lose EVERY obligation identity and 410 keep every one — an all-or-nothing split with ZERO partial cases. Cause: Rust legacy mangling ends in `17h<16 hex>E`, a symbol disambiguator derived from crate metadata and instantiation rather than from the function body, so an unrelated edit renames the function. `func_ident` is the first component of every key, so the churn takes the whole function's obligations with it."
        - "MEASURED 2026-08-27 with the isolating fixture this AC demanded (`feat064_ac3_a_genuine_fix_preserves_obligation_identity`), and the answer SPLITS. Prior state: across 7 commit pairs of scry's own history ZERO shared sites changed their obligation set — a fact about the SAMPLE, since scry's commits alter analyzer logic and recompile into different monomorphizations. The fixture isolates it with a GENUINE, semantics-preserving fix (`$r` defaults to 0; `br_if` out of an ALREADY PRESENT block returns 0 when the divisor is zero) that opens no region and adds no second `i32.div_s`. (1) IDENTITY SURVIVES PERFECTLY — same `site_key`, byte-identical `obligation_id`s. The structural obstacle is therefore REMOVED for region-preserving fixes: identity is not what blocks adjudication on this shape. Mutation-checked — swapping the fix to an `if/else` guard moves the site and turns the test red. (2) THE OBLIGATION SET IS UNCHANGED ANYWAY: `div-by-zero` still fires, because `br_if` on `i32.eqz` licenses `divisor != 0` on the FALL-THROUGH path and `refine_interval` documents that a disequality carves no interval (`(GuardOp::Eq, false) => return iv`). So the open hypothesis is not resolved as `a fix cannot present as changed` but replaced by a sharper, PRECISION obstacle, tracked as FEAT-089. Fix shapes that DO open a region (`if/else`, folded or statement form) move the identity AND havoc the region, losing both. PREVALENCE IS UNMEASURED: five hand-written fixtures, zero observed real fixes — this states which SHAPES behave how, not how common each shape is."
        - "Given an edit that inserts instructions EARLIER in the same function AND the inserted code contains no operator of the same kind in the same region and opens no new block/loop/if at the same-or-shallower depth, When scry re-analyzes, Then obligation IDs for later sites in that function are unchanged (pc-shift immunity). QUALIFIED after clean-room review: the unrestricted form of this AC is FALSE — see DD-020's limitation section. The original wording was met only by a fixture selected around the failing case."
        - "Given one operator that raises SEVERAL obligations (an `i32.div_s` raises both div-by-zero and signed-overflow at one pc), When scry stamps identities, Then the obligations receive DISTINCT ids — the site alone is not a discriminator. EXTENDED 2026-08-27, and the extension is a finding: this AC states a GENERAL property, and its test verified it for OPEN obligations ONLY. MEASURED — none of the five FEAT-064 tests referenced `proven-safe` or `LeverageableFact`, and the identical property was BROKEN for them through the whole FEAT-064/077/087 identity arc: two facts at one pc (`i32.div_s` proving both divide-by-zero-safe AND INT_MIN/-1-overflow-safe) shared a single `obligation_id`. It surfaced only when FEAT-089 needed an open->proven transition to preserve identity — the first time anything had to care what a proven-safe id WAS. FEAT-089 repaired the mechanism and left no oracle; `feat064_ac5_two_proven_safe_facts_at_one_pc_get_distinct_ids` now pins it, MUTATION-CHECKED: restoring the pre-FEAT-089 keying (id_code always None, asserted to match exactly one site) turns it red. An AC whose test covers half its stated scope is not a verified AC."
        - "Given a module-scoped advisory (unbounded-stack, which uses a `(func 0, pc 0)` sentinel rather than a real site), When scry stamps identities, Then it receives a module-scoped identity that neither collides with a genuine advisory at func 0 pc 0 nor drifts when func 0's first instruction changes."
        - "Given proofs/rocq/ObligationId.v, When built (//proofs/rocq:obligationid_test), Then the QUALIFIED invariance is proven admit-free: an insertion of operators of other kinds leaves a later site's intra-region ordinal — hence its identity — unchanged (ordinal_stable_under_foreign_insertion / _anywhere). CORRECTED after the proof was written: the earlier wording claimed `id equality implies same structural site`, which is a HASH property requiring collision resistance and is NOT proven — the theorems are about the key tuple, not the digest."
        - "Given the same file, When built, Then the NECESSITY of that qualification is itself mechanized, not left as a caveat: ordinal_shifts_under_same_kind_insertion proves one same-kind insertion strictly increases the ordinal (so the unqualified AC is FALSE), and survivor_inherits_deleted_identity proves a surviving site takes the deleted site's ordinal — the aliasing hazard that obliges FEAT-065 to degrade to `uncertain` rather than report `discharged`."
    links:
      - type: traces-to
        target: REQ-020
      - type: traces-to
        target: REQ-018

  - id: FEAT-065
    type: feature
    title: "v3.4 — `scry verify --against`: scry adjudicates its own oracle"
    status: accepted
    release: v3.4.0
    description: >
      Turn the v3.1 prose verification oracle into a machine verdict. `scry verify
      --against <previous.json>` compares a fresh analysis with a prior one and
      classifies every obligation by its stable ID (FEAT-064):
        discharged          — was open, now PROVEN-SAFE (the fix worked)
        still-open          — unchanged
        regressed           — was PROVEN-SAFE, now an obligation (the fix broke it)
        moved               — same ID, different position (informational, NOT progress)
        removed-with-code   — the site no longer exists (NOT a discharge)
      Exit code is machine-usable so an agent loop can gate on it. This is the
      capability REQ-018 promised: an agent's edit judged by a SOUND
      over-approximation, so a satisfied oracle is a proof the trap cannot fire —
      not "the tests still pass".
      CONSERVATISM (added after the FEAT-064 clean-room): obligation identity is
      not injective across arbitrary edits — a same-kind operator deleted earlier
      in a region transfers its id to the next one (DD-020 limitation). The
      adjudicator must therefore treat `discharged` exactly as the analyzer
      treats PROVEN-SAFE: claim it only when it is certain. When a function's
      same-kind operator multiset changed in a way that could alias, the verdict
      degrades to `uncertain`, never to `discharged`. A sound checker that
      over-claims a discharge is the same error as an unsound analysis, one layer
      up — and it is the error an agent optimising against the verdict would
      exploit fastest.

      HONESTY (the load-bearing distinction): `removed-with-code` must never be
      reported as `discharged`. Deleting the code that contained an unproven
      obligation is not proving anything, and an agent optimising against a
      conflated verdict would learn to delete rather than to fix.
    tags: [ai-agent, oracle, fix-verify-loop, gate, v3.3]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "CORRECTED 2026-08-27, FALSIFIED BY MEASUREMENT. This AC read: an edit adding a correct guard yields `discharged`. FEAT-089 measured that it does NOT — the canonical div-by-zero repair guards with `br_if` on `i32.eqz`, which establishes `divisor != 0` on the fall-through edge, and `refine_interval` documents that a disequality carves no interval. The obligation still stands after a correct fix (scry#165). An adjudicator asserting this AC would demand behaviour scry cannot produce. RESTATED: given an edit adding a guard scry CAN see (one that narrows an interval), the obligation is reported `discharged` only when the full conjunction below holds. MEASURED FURTHER: because term (5) requires an unchanged operator shape, a `br_if` guard insertion can NEVER discharge — it changes the shape. The fix shapes that CAN discharge are immediates-only edits (`i32.const 0` -> `i32.const 7`) and fixes in another function. Consistent with FEAT-089 either way, but narrower than this AC implied."
        - "THE VERDICT SET MUST SEPARATE `unfixed` FROM `fix-invisible`, and this is the design consequence of FEAT-089. `still-open` previously meant both `the agent did not fix it` and `scry cannot see the fix`. An adjudicator conflating those sends an agent to re-fix working code in a loop — worse than no adjudicator, and the exact failure REQ-021 exists to prevent. Two terms: `still-open-untouched` (site survives, obligation persists, the function body is UNCHANGED — genuinely not addressed) and `still-open-after-edit` (site survives, obligation persists, the body DID change — scry cannot distinguish an ineffective fix from one it cannot see, and this is explicitly NOT a failure signal to the agent)."
        - "The discriminator between those two must be SOUND and cheap: compare the function body across runs (the same shape hash scry already computes for the unnamed-function identity tier). A body that did not change cannot contain a fix; a body that did change may contain an invisible one."
        - "CORRECTED 2026-08-27 BY IMPLEMENTATION, and the correction is the finding: the conjunction needs FIVE terms, not four. (1) the ordinal domain's membership is unchanged (DD-021); (2) `!id_build_local` (FEAT-077); (3) `ident_survives_own_edit` (FEAT-087); (4) matched by `site_key`, never `obligation_id`, which embeds the code that changes on the very transition being detected; (5) THE CONTAINING FUNCTION'S OPERATOR SHAPE IS UNCHANGED. Term (5) was missing and is load-bearing: AC10's cardinality-preserving delete+insert satisfies (1)-(4) and would be a FALSE DISCHARGE without it. VERIFIED INDEPENDENTLY by dropping term (5) — AC10 turns red, resurrecting exactly the defect that withdrew PR #120. Term (1) is now SUBSUMED: an unchanged shape implies an identical operator sequence, hence identical ordinal domains, so it can never fail independently. Its mutant SURVIVES BY CONSTRUCTION (verified: dropping it leaves all 14 tests green). It is retained as a defensive margin should `body_shape_hash` ever become coarser, and that surviving mutant is recorded here rather than left to look like an untested conjunct."
        - "HONEST CONSEQUENCE, stated up front and CORRECTED BY MEASUREMENT. On a STRIPPED module term (3) is false for EVERY obligation (FEAT-087 measured 10,520 of 10,520), and stripping is standard in release builds, so `discharged` is UNREACHABLE there — that part holds exactly. The original phrasing 'every verdict degrades to uncertain' was imprecise: measured, UNEDITED functions still receive `still-open-untouched`, and only EDITED ones degrade to `uncertain` plus `introduced`, with the gate failing. The load-bearing claim — that REQ-021's loop cannot converge on the common production shape — is unaffected."
        - "RED-FIRST FIXTURE ALREADY EXISTS: `feat064_ac3_a_genuine_fix_preserves_obligation_identity` produces the fix-invisible case (identity preserved, obligation unchanged, body edited). The adjudicator must return `still-open-after-edit` for it, not `still-open`. This makes the distinction testable rather than speculative."
        - "Given an edit that DELETES the function containing an open obligation, When verify runs, Then it is reported `removed-with-code`, never `discharged`."
        - "Given an edit that invalidates a previously PROVEN-SAFE site, When verify runs, Then it is reported `regressed` and the exit code signals failure."
        - "ADVERSARIAL BAR (added 2026-08-20 after review refuted the first implementation; each case must be shown RED against the pre-rework adjudicator before it is fixed). Given a module compared with ITSELF, When verify runs, Then EVERY verdict is `still-open-untouched` (CORRECTED: this AC predated AC2's split of `still-open` into two terms; self-comparison means unchanged bodies. MEASURED at module scale on scry's own binary: 10,558 of 10,558 `still-open-untouched`, zero of every other class, gate PASS) — no `regressed`, no `moved`, no `discharged`. The original test for this passed vacuously."
        - "Given a cardinality-preserving edit — one same-kind operator deleted and another inserted in the same region, leaving the group multiset byte-identical — When verify runs, Then the affected obligations are `uncertain`, never `discharged`. This is the case that falsified DD-021's rationale."
        - "Given a function whose identity was derived from `body_shape_hash` (no name-section name, no export name), When verify runs, Then no obligation in it is ever reported `discharged` — the fallback identity cannot corroborate a discharge."
        - "Given an edit that INTRODUCES a new obligation at a site that had no prior advisory, When verify runs, Then a verdict is emitted for it. Pre-rework this produced ZERO verdicts, so an agent that fixed A while breaking B passed clean."
        - "Given the harness of FEAT-073 over scry's own history, When the reworked adjudicator replaces the refuted one, Then the verdict distribution is re-measured and any newly-silent verdict class is explained rather than assumed to be an improvement."
    links:
      - type: traces-to
        target: REQ-021
      - type: traces-to
        target: REQ-018
      - type: traces-to
        target: FEAT-064

  # ── BREADTH: six surfaces, each independently shippable ───────────────

  - id: FEAT-066
    type: feature
    title: "v3.3 — scry-mcp: analyze / query / verify as MCP tools"
    status: proposed
    release: v3.3.0
    description: >
      An MCP server exposing scry to agents directly. Agents cannot run `cargo`;
      today consuming scry means shelling out or scraping a 5.7 MB JSON. Tools:
      `analyze` (module → summary + counts), `query` (FEAT-067 filters),
      `verify` (FEAT-065 adjudication). Returns structured results, never HTML.
      Single biggest adoption lever for the AI-consumer axis (TE-011:
      structured-primary — agents under-read rendered output).
      SCOPE SPLIT (2026-08-20): the v3.3.0 slice is `analyze` + `query` only.
      The `verify` tool follows FEAT-065 into v3.4.0 with REQ-021 — exposing a
      refuted adjudicator over MCP would put a wrong verdict directly into an
      agent's tool loop, which is the single worst place for it to land.
    tags: [ai-agent, mcp, interop, v3.3]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given an MCP client, When it calls `analyze` on a Wasm module, Then it receives a structured summary (counts by advisory class, trap verdicts, gaps) without parsing HTML or reading a multi-MB dump."
        - "Given the v3.3.0 server, When a client enumerates its tools, Then `verify` is ABSENT rather than present-and-unreliable — the deferral is enforced by the tool list, not by documentation."
