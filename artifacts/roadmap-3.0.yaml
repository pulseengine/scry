  - id: FEAT-059
    type: feature
    title: "v3.1 — Remediation advisory engine (sound findings -> ranked, actionable guidance)"
    status: accepted
    release: v3.1.0
    description: >
      Synthesise scry's existing sound findings — FEAT-040 gaps, FEAT-045/046
      trap_checks, FEAT-049 handle_findings, FEAT-021/043 stack bounds,
      FEAT-022/039 reachability, and the proven pentagon/interval/bit facts —
      into a ranked `Vec<Advisory>` on `AnalysisResult` (library-only, like the
      other v3.0 fields). Each Advisory carries: location (func_index + pc,
      resolved to a function name via the FEAT-027 name meta and a source span
      where DWARF/name-section permits), an actionability CLASS
      (DefiniteFault | UnprovenObligation | PrecisionGap | LeverageableFact —
      per REQ-018's honesty split), a rationale, a concrete suggested_action,
      and a verification field naming the oracle that confirms the fix (e.g.
      "this i32.div_s becomes trap_checks DivByZero=ProvenSafe" / "this gap at
      pc N disappears"). Ranked DefiniteFault > UnprovenObligation >
      PrecisionGap, with LeverageableFact surfaced separately as safe
      simplifications. Pure synthesis over already-computed results — adds no
      new unsoundness surface; the advice is only as strong as the finding it
      derives from, and never upgrades a POTENTIAL-TRAP to "bug".
