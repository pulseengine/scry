  - id: FEAT-069
    type: feature
    title: "v3.3 — safe-accesses.json: proven-safe sites for bounds-check elision"
    status: proposed
    release: v3.3.0
    description: >
      Export the PROVEN-SAFE OutOfBounds verdicts scry already computes as a flat,
      engine-agnostic list keyed on the wasmparser operator index — the channel
      synth's `ProvenSafeBoundsChecker` consumes (pulseengine/synth#901) to elide
      software bounds checks on no-MMU targets, where every access is checked and
      synth measures that at ~25-40% overhead.
      Consumer contract: `module_sha256` binds the verdicts to one module and the
      consumer FAILS CLOSED on mismatch; verdicts are proven against the memory's
      guaranteed MINIMUM size, so growth cannot invalidate them; absence from the
      list means "not proven", never "unsafe".
      Interop note: the same shape as the output contract in WasmBounds (Sudo &
      Winstein, Stanford), which is a cleaner interface than our full feed.
    tags: [bounds-elision, synth, interop, embedded, v3.3]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given a module with provably in-bounds i32 accesses, When scry exports safe-accesses.json, Then each entry carries (func, pc, op, width) plus the module hash, and a consumer that fails the hash check elides nothing."
    links:
