  - id: FEAT-069
    type: feature
    title: "v3.3 — safe-accesses.json: proven-safe sites for bounds-check elision"
    status: proposed
    release: v3.3.0
    description: >
      Export the PROVEN-SAFE OutOfBounds verdicts scry already computes as a flat,
      engine-agnostic list keyed on the wasmparser operator index — the channel
      synth's `ProvenSafeBoundsChecker` consumes (pulseengine/synth#901) to elide
      software bounds checks on no-MMU targets, where every access is checked and
      synth measures that at ~25-40% overhead.
      Consumer contract: `module_sha256` binds the verdicts to one module and the
      consumer FAILS CLOSED on mismatch; verdicts are proven against the memory's
      guaranteed MINIMUM size, so growth cannot invalidate them; absence from the
      list means "not proven", never "unsafe".
      Interop note: the same shape as the output contract in WasmBounds (Sudo &
      Winstein, Stanford), which is a cleaner interface than our full feed.

      MEASURED BEFORE BUILDING (2026-08-27, scry's own scry_mcdc.wasm,
      identical stripped and unstripped): scry proves **55** memory accesses
      safe against **8,162** it cannot — a **0.67%** proven rate. The export
      this feature describes would therefore carry 55 sites out of 8,217. synth
      measures software bounds checks at ~25-40% overhead, so eliding 0.67% of
      them recovers on the order of 0.2% of runtime.

      That does not kill the feature, but it relocates the work: the blocker is
      NOT the export format, it is PRECISION. The same module shows 1,639
      `unmodeled-control-flow` and 623 `unsupported-op` advisories — an
      `if`/`else` havocs its region (by design, with an honest gap record), and
      FEAT-089 measured that a disequality guard cannot refine an interval at
      all. Shipping the channel before the payload exists would hand synth a
      correct and nearly empty file. Precision work (FEAT-089 and the
      region-havoc family) should land first, and this AC should be re-measured
      after it, not before.
    tags: [bounds-elision, synth, interop, embedded, v3.3]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given a module with provably in-bounds i32 accesses, When scry exports safe-accesses.json, Then each entry carries (func, pc, op, width) plus the module hash, and a consumer that fails the hash check elides nothing."
    links:
      - type: traces-to
        target: REQ-014
      - type: traces-to
        target: REQ-004

  - id: FEAT-070
    type: feature
    title: "v3.3 — Guard refinement for `br_if` on a bare value (precision)"
    status: accepted
    release: v3.3.0
    description: >
      Our guard refinement recognises `local.get X; i32.const c; <cmp>; br_if`,
      `local.get X; i32.eqz; br_if`, and the two-local compare. It does NOT handle
      `local.tee $x; br_if` — a branch on the raw value's truthiness (implicit
      `≠ 0`), which is what LLVM emits for count-to-zero loops and is therefore
      common in real bounds-check code. Fall-through gets the local `= {0}`, the
      taken edge gets `≠ 0`; the dual of the `i32.eqz` shape already supported.
      Credit: this shape is handled by WasmBounds' BrIf rule (Sudo & Winstein);
      their (value, expression) operand-stack pairing generalises better than our
      syntactic peephole, and a light provenance tag (`Local(i) | Const | Mem |
      Other`) on the abstract stack is the follow-on worth taking from it.
      Directly reduces the 6,191 unproven obligations that make the output
      unusable to an agent — precision as agent UX (REQ-020).
    tags: [precision, guard-refinement, ai-agent, v3.3]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given a count-to-zero loop guarded by `local.tee $i; br_if`, When scry analyzes it, Then $i is bounded on both edges instead of ⊤, and the loop's memory accesses become eligible for PROVEN-SAFE."
    links:
      - type: traces-to
        target: REQ-020
      - type: traces-to
        target: REQ-014

  - id: FEAT-071
    type: feature
    title: "v3.3 — Machine-readable capability manifest (the Scope block as data)"
    status: accepted
    release: v3.3.0
    description: >
      The v3.2.2 dashboard states scry's scope in prose: what is mechanized vs
      γ-sweep-validated, and what scry does NOT prove. An agent deciding whether
      to trust a verdict needs that as DATA, not paragraphs. Emit a manifest
      enumerating each domain/transfer with its evidence kind
      (`mechanized | gamma-swept | asserted`) and the named open gaps.
      Same single source as the claim ledger (claims.yaml), so the manifest, the
      dashboard prose, and CI cannot drift apart.
    tags: [ai-agent, honesty, qualification, schema, v3.3]
    fields:
      phase: phase-3
      acceptance-criteria:
        - "Given the guidance feed, When an agent reads it, Then `scope` carries every capability with a machine-readable evidence kind (`mechanized` / `gamma-swept` / `runnable-attested`) and the not-proven list ENUMERATED rather than prose. RED FIRST: failed with `the feed must carry a scope manifest, not leave scope to the page`, after the non-vacuity assertion on the manifest constants had already passed."
        - "SINGLE SOURCE, so page and feed cannot drift: both are rendered from the same `SCOPE_EVIDENCE` / `SCOPE_NOT_PROVEN` constants, and the oracle requires every not-proven item to appear in BOTH surfaces. MUTATION-CHECKED: emitting empty strings in the FEED while the page still lists them (asserted a single matching line before applying) kills the test with `not-proven item missing from the FEED`."
        - "THE DRIFT THIS REPLACES IS MEASURED, not hypothetical. The previous block was hand-written prose whose not-proven list named only PROVENANCE limits (WasmCert not imported, memory-content model, not a qualified tool) and NONE of the dominant practical ones. Measured on a real module: `unmodeled-control-flow` 15.6% and `unsupported-op` 5.9% of advisories, against a proven-safe rate of 0.6%. An agent reading it would have formed a materially more optimistic picture than the numbers support. The enumerated list now names the if/else region havoc, the unsupported-op function scrub, and the disequality limit (issue #165)."
        - "Given the scope block, When rendered, Then it reports the MEASURED shape of THIS analysis. The function previously ignored its `AnalysisResult` entirely (the parameter was `_r`), so it said the same thing about every module."
        - "Human legibility is NOT traded for machine readability: the pre-existing `hero_and_scope_copy_finalized` gate still passes unchanged, because each evidence kind renders its human phrasing AND its machine tag. A manifest a human cannot read is a different failure from prose a machine cannot read, not a fix for it."
