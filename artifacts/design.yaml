artifacts:

  # ──────────────────────────────────────────────────────────────────────
  # Design decisions — the architectural shape of the AI pass.
  # ──────────────────────────────────────────────────────────────────────

  - id: DD-001
    type: design-decision
    title: Place the Core-Wasm abstract-interpretation pass between meld and loom
    status: draft
    tags: [pipeline-placement, core]
    fields:
      decision: >
        The Core-Wasm AI pass runs on the fused Core Wasm module emitted
        by meld and before loom's optimization passes. Its outputs are
        consumed by loom as invariant annotations and by rivet/sigil as
        verification evidence.
      rationale: >
        meld lowers the Component Model to a single fused Core Wasm
        module — every artifact downstream of meld therefore operates on
        Core Wasm, not on components. Placing the AI after meld means
        it sees the actual code loom is about to transform, so its
        invariants apply directly to loom's transformation preconditions
        without translation. Placing it after meld also means a single
        AI implementation covers all downstream consumers (loom, witness
        for coverage prediction, synth for codegen invariant
        generation) without needing component-aware logic in any of them.
      alternatives: >
        (a) Inline as a loom analysis pass — rejected because the AI
            crate should be reusable by tools that don't link loom (DD-004,
            REQ-006), and because loom's translation-validation strategy
            is independent of how invariants were produced.
        (b) Pre-meld on each component individually — keeps Component
            Model structure visible to AI but cannot reason about cross-
            component composition after fusion. Best paired with DD-002
            rather than substituted for it.
        (c) Post-loom — too late: the optimizer has already discarded
            information AI could have used to certify its own
            transformations.
      source-ref: "https://pulseengine.eu/blog/2026-04-22-overdoing-the-verification-chain/"
    links:
      - type: satisfies
        target: REQ-001
      - type: satisfies
        target: REQ-004
      - type: traces-to
        target: DD-002
      - type: traces-to
        target: DD-004
      - type: traces-to
        target: REQ-006

  - id: DD-002
    type: design-decision
    title: Component-Model AI placement — adopt option (b), meld emits a minimal component-provenance custom section
    status: approved
    tags: [pipeline-placement, component-model]
    description: >
      Closes the open architectural choice on where scry's Component-
      Model analysis sits relative to meld. The chosen option (b)
      splits responsibility cleanly: scry runs Component-Model
      analysis on the original component sources upstream of meld;
      meld emits a minimal `component-provenance` custom section
      mapping fused-module function indices back to their originating
      component+function; scry projects the resulting invariants onto
      fused-module locations using that section. See the rationale
      and alternatives fields for the full reasoning and the
      investigation of meld that grounded the call.
    fields:
      decision: >
        scry runs its Component-Model analysis (resource lifetimes,
        capability flow, host-call effects, WIT refinement) on the
        original component sources upstream of meld. meld grows a
        minimal custom section `component-provenance` that records the
        per-function origin mapping (fused-module function index →
        originating-component id + originating-function index). The
        post-meld scry stage uses this mapping to associate the
        Component-Model invariants with locations in the fused Core
        Wasm module so they are consumable by loom, witness, and the
        sigil/rivet evidence chain. meld is otherwise unchanged; the
        Component-Model semantics live entirely inside scry.
      rationale: >
        Investigation of meld confirmed two facts that collapse the
        decision: (1) meld already emits a custom section
        (`wsc.transformation.attestation`) and already tracks per-
        function origin tuples internally (`MergedFunction.origin :=
        (comp_idx, mod_idx, func_idx)` in `merger.rs`) — it just
        discards them after fusion. Adding a `component-provenance`
        custom section is ~300 LOC of bolt-on work, not a deep
        architectural change. (2) meld's Rocq proofs (~13.3k LoV
        across 23 files) prove forward simulation + trap simulation
        between the composed component graph and the fused Core Wasm
        module — i.e. they cover Core Wasm SEMANTIC preservation.
        They do not cover Component-Model invariants (handle
        lifetimes, capability flow, WIT refinement) by DESIGN, not by
        gap: those properties are not in meld's scope.
        This makes option (c) unnecessary — there is no fusion-
        correctness gap to re-verify, only a Component-Model semantic
        layer that belongs in scry. Option (a)'s "two analyzer
        implementations" tax is also unnecessary: with the minimal
        provenance custom section, a single scry implementation can
        analyze the original components and project results onto the
        fused module. The boundary becomes cleanly typed: meld owns
        Core Wasm fusion correctness (proven in Rocq); scry owns
        Component-Model semantics (proven separately). The custom
        section is the typed contract between them.
      alternatives: >
        (a) Pre-meld pass only — rejected because the post-meld
            consumers (loom, witness, sigil-signed evidence) need to
            associate invariants with locations in the fused module,
            which requires SOME meld-side mapping. Without that
            mapping, option (a) leaves the Component-Model invariants
            disconnected from the downstream chain.
        (c) Pre-meld pass + meld preservation + post-meld
            re-verification — rejected because meld's Rocq proof
            covers exactly what re-verification would check at the
            Core Wasm level. Re-verifying Component-Model invariants
            through fusion would require LIFTING the meld proof to
            cover Component-Model semantics, which is a much larger
            piece of work than just doing the analysis in scry once
            with origin mapping.
        (b.1 vs b.2 scope) — the chosen variant is (b.1): minimal
            provenance (function-origin map only). The alternative
            (b.2) would also record resource type names and handle
            shapes in the custom section. That is rejected for v0.7
            because scry can derive those from the original component
            sources directly; preserving them in meld output is
            useful for a no-source post-hoc analysis story but is
            out-of-scope for the v0.7 milestone.
      source-ref: "Investigation of meld at /Users/r/git/pulseengine/meld/ — emitter in src/lib.rs:1259-1437, merger origin tuples in src/merger.rs:59-63, Rocq proofs in proofs/rocq/ (esp. fusion_spec.v)"
    links:
      - type: satisfies
        target: REQ-003

  - id: DD-003
    type: design-decision
    title: Adopt WasmCert-Coq + Iris-Wasm as the soundness substrate
    status: draft
    tags: [soundness, mechanization]
    fields:
      decision: >
        The mechanized soundness story for the AI pass is anchored on
        WasmCert-Coq (mechanized Wasm 1.0 operational semantics) with
        Iris-Wasm (higher-order separation logic) as the substrate for
        relational and modular soundness arguments. Initial v0 ships
        with soundness theorems stated paper-only; mechanization in
        Rocq follows.
      rationale: >
        WasmCert-Coq is the only mechanization of the official Wasm
        operational semantics with active maintenance in 2025-2026
        (AC-003, TE-004). Iris-Wasm (AC-004) layers higher-order
        separation logic on it, which is exactly the right tool for
        modular composition reasoning that meld's fusion will require.
        PulseEngine already invests heavily in Rocq via rules_rocq_rust,
        meld's fusion-correctness proofs, and synth's i32-semantics
        proofs — so the toolchain investment is sunk and the proofs
        live in the same ecosystem.
      alternatives: >
        (a) WasmCert-Isabelle — equally credible mechanization, but
            PulseEngine's existing Rocq investment makes Coq the lower-
            friction choice.
        (b) Self-mechanize against SpecTec (AC-005) — strategically
            attractive long-term once a SpecTec→Rocq backend exists, but
            premature today.
        (c) No mechanization, paper proofs only — sufficient for v0,
            insufficient for a credit-bearing safety case claim at
            ASIL-D / DAL-A.
      source-ref: "https://github.com/WasmCert/WasmCert-Coq"
    links:
      - type: satisfies
        target: REQ-002
      - type: references-paper
        target: AC-003
      - type: references-paper
        target: AC-004
      - type: references-paper
        target: AC-005
      - type: evaluates-tech
        target: TE-004

  - id: DD-004
    type: design-decision
    title: Implement a reusable wasm-lattice crate decoupled from the Wasm front-end
    status: draft
    tags: [architecture, reusability]
    fields:
      decision: >
        The abstract-domain library — intervals, octagons, region-memory,
        reachability, taint, capability-flow, resource-lifetime — ships
        as a separate Rust crate (working name `wasm-lattice`) with no
        dependency on Wasm parsing or the fixpoint engine.
      rationale: >
        Brandl et al. ECOOP 2023 (AC-006) demonstrate exactly this
        modular pattern: ~19 language-independent semantic components
        in the Sturdy framework let them build dead-code / constant-
        propagation / taint analyses each in under 210 LOC once the
        domain library exists. Separating the lattice crate yields the
        same payoff for PulseEngine: witness can reuse it for coverage-
        gap prediction, synth can reuse it for ARM/RISC-V codegen
        invariant generation, and external tools can adopt it without
        pulling the rest of the stack.
      alternatives: >
        (a) Bundle the lattice into the AI front-end crate — rejected
            because it makes downstream reuse painful and entangles
            soundness proofs with parsing details.
        (b) Use MIRAI's domain library directly — rejected because MIRAI
            is research-grade and explicitly experimental (TE-002), and
            its abstractions are MIR-shaped rather than Wasm-shaped.
        (c) Bind CRAB via FFI — CRAB (TE-005) has the best memory model
            in OSS, but it's C++ and FFI ergonomics in a Rust pipeline
            would be a maintenance burden.
    links:
      - type: satisfies
        target: REQ-006
      - type: references-paper
        target: AC-006
      - type: evaluates-tech
        target: TE-002
      - type: evaluates-tech
        target: TE-005

  - id: DD-005
    type: design-decision
    title: Initial v0 domain set — intervals + region-memory + reachability + sound indirect-call resolution
    status: draft
    tags: [domains, scoping]
    fields:
      decision: >
        v0 of the AI pass ships with four composed abstract domains:
        (1) interval for i32/i64 numeric ranges,
        (2) region-based memory model (CRAB-style, TE-005) for linear-
            memory shape and offsets,
        (3) reachability (powerset of program points) for dead-code,
        (4) sound indirect-call resolution via value-domain AI on the
            operand stack (Paccamiccio et al. technique, AC-008).
        Octagons and floating-point polyhedra are deferred to v1.
        Taint, capability-flow, and resource-lifetime are deferred to
        v2 (they require either the Component-Model pass per DD-002 or
        explicit security/component requirements).
      rationale: >
        The four chosen domains cover exactly the loom-relevant
        analyses (bounds-check elision, constant folding via intervals,
        dead-code via reachability) and exactly the soundness pre-
        condition (call-graph soundness via AC-008). They keep v0 small
        enough to ship with paper soundness proofs against AC-002 and
        leave room for relational and security domains as separable
        v1/v2 additions. Brandl et al. (AC-006) ship comparable
        analyses each in <210 LOC once the lattice library exists, so
        the v0 scope is consistent with one engineer-quarter of work.
      alternatives: >
        (a) Start with full Astrée-class domain set (intervals +
            octagons + ellipsoids + floating-point polyhedra) —
            rejected as gold-plating for v0; relational domains pay off
            once we have a concrete benchmark of false-alarm rates.
        (b) Start with taint-only (Wanilla-style, AC-007) — rejected
            because the immediate consumers (loom, witness) want
            numeric and shape invariants, not security labels.
        (c) Defer indirect-call resolution to v1 — rejected because
            without it every interprocedural analysis is unsound per
            MF-003, undermining the soundness story.
    links:
      - type: satisfies
        target: REQ-001
      - type: satisfies
        target: REQ-008
      - type: references-paper
        target: AC-002
      - type: references-paper
        target: AC-006
      - type: references-paper
        target: AC-007
      - type: references-paper
        target: AC-008
      - type: evaluates-tech
        target: TE-005
      - type: addresses-finding
        target: MF-003
      - type: traces-to
        target: DD-002

  - id: DD-006
    type: design-decision
    title: Use compositional summary-based interprocedural analysis to scale to fused modules
    status: draft
    tags: [scalability]
    fields:
      decision: >
        Interprocedural analysis uses per-function abstract summaries
        in the Stiévenart-De Roover (AC-010) style: each function gets
        a summary describing the abstract effect of its parameters and
        globals on its outputs and side effects. Summaries are computed
        bottom-up over the (sound) call graph and reused at every call
        site. Recursive components are handled by widening at the
        recursion frontier.
      rationale: >
        meld produces fused Wasm modules that can be substantially
        larger than any single component. Monolithic whole-program AI
        does not scale to those sizes. Compositional summaries are the
        established technique (AC-010 reports ≥64% of summaries
        computed precisely under one minute on 196 kLOC of Wasm) and
        compose well with the call-graph soundness guarantee from
        DD-005.
      alternatives: >
        (a) Pure monolithic analysis — simpler, but does not scale.
        (b) Per-component analysis only — rejected because it cannot
            see post-fusion call sites that cross component boundaries.
        (c) Top-down call-string-bounded analysis — alternative
            interprocedural strategy; rejected for v0 because bottom-up
            summaries cache better in CI re-analysis.
    links:
      - type: satisfies
        target: REQ-007
      - type: references-paper
        target: AC-010
      - type: traces-to
        target: DD-005

  - id: DD-007
    type: design-decision
    title: Emit AI results as sigil-signed in-toto predicates linked from rivet
    status: draft
    tags: [attestation, integration, rivet, sigil]
    fields:
      decision: >
        Each AI run emits an in-toto predicate signed by sigil,
        containing: (input-module SHA-256, lattice-library version,
        analyzer version, configured domain set, configured widening
        thresholds, full set of proven invariants in a stable on-disk
        schema, any unsound-construct fallbacks encountered). Rivet
        schemas allow a `verified-by` link from a requirement to the
        attestation's content-addressed identifier.
      rationale: >
        The PulseEngine attestation story (sigil) already covers fusion
        proofs (meld), optimization proofs (loom), and coverage reports
        (witness) — AI attestations slot into the same scheme without
        new infrastructure. Content-addressing the attestation lets
        rivet trace from a requirement's "verified" status back to the
        exact AI run that established it, satisfying ISO 26262-8 §11
        traceability and DO-178C §11.20 software verification record
        expectations.
      alternatives: >
        (a) Plain JSON output, no signing — rejected because un-signed
            verification evidence cannot bear safety-case weight.
        (b) Sign individual invariants — rejected as over-granular;
            atomic-run signing is sufficient and matches the rest of
            the PulseEngine attestation story.
    links:
      - type: satisfies
        target: REQ-005

  - id: DD-008
    type: design-decision
    title: scry ships as a WebAssembly Component Model component (dogfood)
    status: approved
    tags: [packaging, dogfood, component-model]
    description: >
      The scry analyzer ships as a wasm32-wasip2 Component Model
      component, not a native binary. Implementation runs inside a
      Wasm runtime (kiln in production; wasmtime for local
      development); WIT interfaces define its inputs and outputs.
    fields:
      decision: >
        scry's primary deliverable is a Wasm Component Model component
        published as a `pulseengine:scry@x.y.z` package. The
        `analyzer.analyze` function is exported via WIT; consumers
        invoke scry through any Component Model host (kiln,
        wasmtime, wasm-tools, browser-side via jco). A thin native
        CLI wrapper may be provided for convenience but is not the
        primary distribution.
      rationale: >
        PulseEngine's value claim is that the same Wasm Component
        Model toolchain produces credit-bearing safety evidence
        across six standards. Shipping scry as a Wasm component is
        the most direct way to validate that claim: scry's own
        artifact passes through meld (or trivially through its
        absence at v0.1), is signed by sigil, has its branches
        measured by witness, and is allocated to a kiln runtime via
        spar AADL — exactly the chain scry is supposed to analyze
        for other consumers. Dogfooding catches integration issues
        in the chain before external users hit them and provides
        the most credible existence proof of the chain's viability.
      alternatives: >
        (a) Native Rust binary — rejected for v0.1 because it would
            require a parallel "scry-as-component" effort later to
            actually dogfood the chain, doubling the implementation
            cost.
        (b) Hybrid: native binary + optional Wasm component — the
            chosen approach is the Wasm component plus an optional
            native CLI wrapper for ergonomics. Pursuing both as
            first-class deliverables doubles the test matrix without
            doubling the value.
    links:
      - type: satisfies
        target: REQ-001

  - id: DD-009
    type: design-decision
    title: Build scry with Bazel + rules_wasm_component (canonical PulseEngine path)
    status: approved
    tags: [build, bazel, rules_wasm_component]
    description: >
      Adopt the PulseEngine-canonical Bazel rule family
      `rules_wasm_component` (v1.0.0) for the scry component build
      from the first commit. No Cargo-only path for the component
      itself; a host-side Cargo workspace may still exist for test
      harnesses or generators.
    fields:
      decision: >
        scry's component build is driven by `rules_wasm_component`
        v1.0.0. `MODULE.bazel` declares the dependency; `BUILD.bazel`
        uses `rust_wasm_component_bindgen` to produce the
        `pulseengine:scry@0.1.0` Wasm artifact. WIT files live at
        `wit/scry.wit`. The Bazel rule wires `wit-bindgen` into the
        build automatically; no `build.rs` is needed.
      rationale: >
        Every shipping PulseEngine project uses
        `rules_wasm_component` (wohl, falcon, the meld/loom/synth
        examples). It is v1.0.0 stable, eliminates Cargo version
        skew across the family, and pulls in the hermetic toolchain
        the rest of the chain already trusts. Adopting it from day
        one avoids a Cargo→Bazel migration later. Witness's Cargo-
        only `crates/witness-component/` is a deliberate dogfooding
        exception rather than the family template.
      alternatives: >
        (a) Pure Cargo with `--target wasm32-wasip2` — rejected
            because every downstream PulseEngine consumer (meld,
            kiln, sigil) integrates via Bazel; supporting Cargo
            adds friction with no compensating benefit for a brand-
            new project.
        (b) Bazel with hand-rolled `genrule` calling `wasm-tools`
            directly — rejected because `rules_wasm_component`
            already encapsulates the right pattern (wit-bindgen,
            cdylib, post-processing) and is the test-anchor for the
            rest of the family's Bazel builds.
      source-ref: "https://github.com/pulseengine/rules_wasm_component"
    links:
      - type: satisfies
        target: REQ-001
      - type: traces-to
        target: DD-008

  - id: DD-010
    type: design-decision
    title: v0.1 — hand-write WIT to match the AADL model; integrate spar-codegen in a later version
    status: approved
    tags: [build, wit, spar, methodology]
    description: >
      For v0.1, the WIT world at `wit/scry.wit` is hand-derived from
      the AADL model at `spar/scry.aadl`. The AADL is the
      documentation source of truth; the WIT is what the Bazel
      build actually consumes. spar-codegen WIT generation is
      integrated in a later version (tracked as a follow-on task),
      at which point the hand-written WIT is replaced by generated
      output.
    fields:
      decision: >
        Both `spar/scry.aadl` (AADL architecture model) and
        `wit/scry.wit` (Wasm Component Model interface definition)
        are checked in. Hand-write WIT for v0.1; AADL is the
        documentary and structural source-of-truth. A CI check
        (added at a later version) verifies the hand-written WIT
        structurally matches the AADL model.
      rationale: >
        The PulseEngine methodology calls for WIT to be generated
        from AADL via spar (per the pulseengine-feature-loop skill).
        `spar-codegen/src/wit_gen.rs` is complete (since 2026-03-22)
        but is not operationally integrated: no Bazel rule wraps
        it, no shipping PulseEngine project actually uses it for
        build-time WIT generation today (wohl has AADL + hand-
        written WIT side-by-side). For v0.1 the pragmatic path is
        to hand-write WIT against the AADL model and treat them as
        twins. Wiring the spar-codegen Bazel rule is a separate,
        scoped piece of work that should not block v0.1 ship.
      alternatives: >
        (a) Block v0.1 on full spar-codegen integration — rejected
            because it conflates two distinct pieces of work (the
            scry analyzer itself; the spar→WIT Bazel pipeline) and
            would slip the dogfood-first v0.1 by a quarter or more.
        (b) Skip the AADL model and write only WIT — rejected
            because AADL gives us the architecture model spar
            analyses (timing, ports, modes) need to attach to;
            without it the rivet traceability story loses its top
            layer.
      source-ref: "spar-codegen status: /Users/r/git/pulseengine/spar/crates/spar-codegen/src/wit_gen.rs (complete) ; no Bazel rule yet in rules_wasm_component"
    links:
      - type: satisfies
        target: REQ-001
      - type: traces-to
        target: DD-009

  - id: DD-018
    type: design-decision
    title: v3.2 — Linear-memory segmentation as a parametric functor (bounds × content), weak-by-default stores
    status: proposed
    tags: [memory, segmentation, domain-design, soundness, v3.2]
    description: >
      How FEAT-058 abstracts linear-memory content. A memory region becomes an
      ordered sequence of segments [b0) P1 [b1) P2 ... [bn), where the bounds
      b_i are symbolic offset expressions from scry's existing numeric domain
      (interval/octagon) and each P_i is a value from a plugged-in CONTENT
      domain (intervals for the first slice). The functor is parametric in both
      the bound domain and the content domain (Cousot-Cousot-Logozzo 2011,
      AC-015), reusing scry-interval/-octagon rather than a bespoke encoding.
    fields:
      decision: >
        (1) Representation: ordered segment list with symbolic bounds + per-
        segment content, plus a distinguished "any/uninitialized" content for
        unwritten ranges. (2) Store: STRONG update (split at the offset,
        overwrite the covering segment) ONLY when the store offset and width
        are singletons landing within one segment; otherwise a WEAK update
        (join the stored value into every possibly-overlapping segment). (3)
        Load: the join of every possibly-covering segment's content. (4) Join/
        widen: unify the two partitions to a common coarser partition (merge
        segments whose bounds cannot be ordered), join content per merged
        segment; widening caps the segment COUNT to guarantee termination. (5)
        Escape hatch: growable / imported / shared memory, or a store whose
        offset is ⊤, collapses the region to today's single-⊤-blob region (no
        regression, still sound). (6) New pure crate scry-sai-segment; admit-
        free Rocq (proofs/rocq/Segment.v) for split/merge/join/store/load;
        library-only output (WIT surfacing deferred to FEAT-054).
      rationale: >
        Weak-by-default is the soundness keystone — a strong update on an
        imprecise offset would DROP concrete states and is unsound; scry only
        strengthens when the offset is provably a single cell. Capping the
        segment count keeps the domain of finite height (termination). Reusing
        the interval/octagon domains for bounds and content keeps the transfer
        set small and mechanizable, matching the pentagon/float precedent of a
        new pure crate with its own Rocq file.
    links:
      - type: satisfies
        target: REQ-019
      - type: traces-to
        target: FEAT-058

  - id: DD-019
    type: design-decision
    title: "v3.3 — Convex polyhedra: ELINA-decomposed; mechanize the lattice, γ-sweep the hull (honest scope)"
    status: proposed
    tags: [polyhedra, domain-design, decomposition, soundness, honesty, v3.3]
    description: >
      How FEAT-057 represents polyhedra and how far soundness is mechanized.
      Constraint-form convex polyhedra (Cousot-Halbwachs 1978, AC-012) with
      ELINA-style online decomposition (TE-012): the variable set is
      partitioned into independent blocks, each carrying its own small
      polyhedron, so cost tracks block size not the global dimension.
    fields:
      decision: >
        (1) Representation: constraint form (linear inequalities) partitioned
        into independent variable blocks; blocks merge lazily only when a
        transfer relates their variables. (2) Operators: meet = constraint
        union (re-decompose), join = convex hull per merged block, widening =
        standard polyhedra widening (drop unstable constraints) with a block-
        size cap. (3) Mechanization scope (HONEST, carried from the WasmCert-Coq
        pass): proofs/rocq/Poly.v mechanizes the LATTICE algebra only (order
        reflexive/transitive, join upper-bound, meet lower-bound) admit-free;
        the transfer functions and the convex-hull join are γ-SWEEP-VALIDATED,
        NOT Rocq-mechanized, and are recorded as such in the qualification
        dossier — never presented as "mechanized". (4) New pure crate
        scry-sai-poly; wired above the octagon; surfaced via the FEAT-041
        relational output; sequenced AFTER v3.2.
      rationale: >
        Full convex-hull / Fourier-Motzkin soundness in Rocq is a research
        project in itself; claiming it "mechanized" would be exactly the
        overclaim the WasmCert-Coq honesty pass removed. Mechanizing the
        lattice algebra (cheap, true) and γ-sweeping the transfers (a credible
        falsifier) matches the float precedent (Float.v mechanizes the lattice;
        rounding transfers are γ-sweep only) and keeps every dossier claim
        defensible. ELINA decomposition is what makes polyhedra tractable at
        all — without it the constraint blow-up is prohibitive.
    links:
      - type: satisfies
        target: REQ-016
      - type: traces-to
        target: FEAT-057

  - id: DD-020
    type: design-decision
    title: "v3.3 — Obligation identity: structural content-address, not (func, pc)"
    status: proposed
    tags: [ai-agent, identity, fix-verify-loop, schema, v3.3]
    description: >
      How FEAT-064 names a finding so the name survives an edit. scry's internal
      key is `(func_index, pc)`, which is correct for the analyzer and useless as
      an external identity: any inserted instruction renumbers every later pc, so
      a consumer comparing two runs cannot tell DISCHARGED from MOVED. Since the
      whole REQ-020 fix-verify loop rests on that distinction, identity is a
      design decision in its own right rather than a field format.
    fields:
      decision: >
        An obligation ID is a content address over four components, in this
        order: (1) FUNCTION IDENTITY — the name-section name if present, else the
        export name, else a hash of the function body's structural shape (opcode
        sequence with immediates elided). AMENDED 2026-08-25 (FEAT-076,
        scry#123): a name-section name carrying Rust's `17h<16 hex>E`
        disambiguator is used STRIPPED when the stripped form is unique within
        the module; when it is not unique the raw name is kept and the advisory
        is marked `id_build_local` — see limitation (6); (2) STRUCTURAL PATH — the chain of
        enclosing block/loop/if indices from the function root, NOT raw pcs;
        (3) OPERATOR KIND — e.g. `i32.load`, `i32.div_s`; (4) ORDINAL — the
        operator's index among same-kind operators within its own basic block.
        The ID is the hash of that tuple. `(func_index, pc)` remains in the
        output as a positional convenience, explicitly documented as unstable.
        The adjudicator (FEAT-065) reports five outcomes and must keep
        `removed-with-code` strictly distinct from `discharged`.
      rationale: >
        Each component is chosen for what it is invariant under. Function
        identity by name survives the function moving in the index space (adding
        a function elsewhere renumbers indices). The structural path survives
        instruction insertion elsewhere in the same function, which raw pcs do
        not. The intra-block ordinal keeps two same-kind operators in one block
        distinguishable without reintroducing a global counter. Hashing the tuple
        keeps the ID opaque and fixed-width, so consumers cannot start parsing it
        and depending on the layout.
        The body-shape hash is the fallback, and it is deliberately the WEAKEST
        of the three: a module stripped of names gets IDs that change whenever
        the function is edited at all. That is honest degradation — with no name
        section there is no stable notion of "the same function" — and it is why
        the fallback is last rather than the default.
        On the correctness claim: only `id(a) == id(b) ⇒ same structural site` is
        provable and will be mechanized (ObligationId.v). The converse is FALSE
        by construction — a rewritten function should produce new IDs, because
        the old site genuinely no longer exists. Claiming stability under
        arbitrary edits would be the overclaim here, and it is the one an agent
        would be most damaged by trusting.
      limitations: >
        Recorded after adversarial clean-room review of the v3.3 implementation
        — these are properties the scheme does NOT have, and the FEAT-065
        adjudicator is required to be conservative in exactly these cases.
        (1) ORDINAL ALIASING (the significant one). The intra-region same-kind
            ordinal is positional, so deleting the first of two same-kind
            operators makes the survivor inherit the deleted one's id. An
            adjudicator diffing those two runs would report the deleted
            obligation as still-open and the survivor as new — both wrong. This
            is the very failure mode alternative (c) was rejected for; the
            ordinal reintroduces a bounded form of it by construction. It is
            accepted because the alternatives are worse, and MITIGATED at the
            consumer: FEAT-065 degrades to `uncertain` rather than claiming
            `discharged` when a region's same-kind multiset changed.
        (2) The pc-shift invariance holds only for insertions that contain no
            same-kind operator in the same region and open no new sibling region
            (a new sibling renumbers `opened[depth]` and every path beneath it).
            FEAT-064's AC is qualified accordingly.
        (3) `if`/`else` share one region and one ordinal counter, so an edit in
            one branch renumbers same-kind operators in the other.
        (4) Two UNNAMED functions with byte-identical bodies share a
            `body_shape_hash` and therefore collide across functions. Only the
            name-section/export identities are function-unique.
        (5) `try_table` (and legacy `try`) open an `End`-terminated region but are
            not treated as path markers, so their `End` pops a region they never
            opened and the paths below are wrong for exception-handling modules.
            Tracked; no panic and no intra-function collision.
        (6) DISAMBIGUATOR CHURN (scry#123, measured by FEAT-073's first run;
            REPAIRED in part by FEAT-076). The name-section name inherits Rust
            legacy mangling's `17h<16 hex>E` symbol disambiguator, derived from
            crate metadata rather than the body — raw-name survival across an
            unrelated one-commit edit measured 54.8%, and 54.9% across an edit
            to the function's OWN body, so the raw name is destroyed by the
            very edit the identity exists to survive. FEAT-076 makes function
            identity two-tier: the stripped name when unique within the module
            (measured 100% stable), else the raw name with the advisory marked
            `id_build_local: true`. RESIDUAL: 37.8% of functions (all
            dependency generics, none of scry's own) share a stripped name and
            therefore keep only a build-local identity — honest and visible,
            but not comparable across builds; a stable identity there needs
            stable-name PLUS instantiation disambiguation, a synthesis that
            needs its own design decision. A second, theoretical residual
            (clean-room): the uniqueness count covers named functions only, so
            a stripped name that is itself exactly 16 lowercase hex characters
            could collide with an UNNAMED function's body-shape hash — real
            Rust legacy symbols start `_ZN…` and are never pure hex, so this
            needs a hand-crafted name plus a SHA-256-prefix coincidence.
      alternatives: >
        (a) Source-line identity via DWARF — rejected as the primary: scry
            analyses Wasm binaries that frequently carry no DWARF, and it would
            make identity depend on the producer toolchain.
        (b) A persisted ID map written by scry and carried between runs —
            rejected: it makes identity stateful, needs a store the consumer must
            not lose, and fails exactly when an agent runs scry on a fresh
            checkout.
        (c) Fuzzy matching between runs (nearest-pc / diff heuristics) —
            rejected: a heuristic that guesses "this is probably the same
            obligation" would report `discharged` on a coincidence, which is the
            single failure this design exists to prevent.
    links:
      - type: satisfies
        target: REQ-020
      - type: traces-to
        target: FEAT-064
      - type: traces-to
        target: FEAT-065

  - id: DD-021
    type: design-decision
    title: "v3.3 — Adjudicating a NON-INJECTIVE identity: three keys, and `discharged` as a certainty claim"
    status: proposed
    tags: [ai-agent, fix-verify-loop, oracle, conservatism, v3.3]
    description: >
      How FEAT-065 compares two runs given that FEAT-064's identity is provably
      NOT injective across arbitrary edits. Two findings forced this to be a
      decision rather than an implementation detail.
      (1) `proofs/rocq/ObligationId.v` PROVES the aliasing hazard
      (`survivor_inherits_deleted_identity`): delete the first of two same-kind
      operators in a region and the survivor's ordinal — hence its identity —
      becomes exactly the deleted site's. A naive diff-by-identity can therefore
      report a FALSE `discharged`: site A is an open obligation, site B at the
      same kind is PROVEN-SAFE, A is deleted, B inherits A's identity, and A's
      identity now resolves to a proven-safe advisory although A was never fixed.
      (2) The advisory CODE is a required component of the identity (clean-room:
      one `i32.div_s` raises both div-by-zero and signed-overflow at one pc, so
      the site alone does not discriminate). But fixing an obligation CHANGES its
      code — `div-by-zero` becomes `proven-safe` — so the full identity is
      unstable across exactly the transition the adjudicator exists to detect.
      Matching on it alone would render every genuine discharge as
      "one identity vanished, an unrelated one appeared".
    fields:
      decision: >
        Emit THREE keys per advisory, each with one job:
          * `obligation_id`  = hash(func_ident, path, kind, ordinal, CODE) —
            globally unique per obligation. What a consumer stores and cites.
          * `site_key`       = hash(func_ident, path, kind, ordinal) — identifies
            the SITE, stable across a code/class change. This is what FEAT-065
            MATCHES ON, so a div-by-zero becoming proven-safe is recognised as
            the same site changing state rather than two unrelated events.
          * `group_key`      = hash(func_ident, path, kind) — the ORDINAL DOMAIN.
            Its membership is what aliasing perturbs, so it is the conservatism
            signal.
        Adjudication outcomes: `discharged`, `still-open`, `regressed`, `moved`,
        `removed-with-code`, `uncertain`.
        `discharged` is a CERTAINTY CLAIM and requires all of: the site_key was an
        open obligation before; it is proven-safe (or raises no obligation) after;
        AND its `group_key`'s site_key SET is unchanged between the two runs.
        If that set changed, the verdict is `uncertain` — never `discharged`.
        `removed-with-code` (the site no longer exists) is a distinct outcome and
        must never be reported as `discharged`.
      rationale: >
        The adjudicator inherits the analyzer's discipline one layer up: scry
        claims PROVEN-SAFE only when the abstract state rules the trap out, and
        FEAT-065 claims `discharged` only when identity cannot have aliased.
        Over-claiming a discharge is the same class of error as an unsound
        analysis, and it is the error an agent optimising against the verdict
        would exploit fastest — an agent rewarded for `discharged` learns to
        DELETE code, which is why `removed-with-code` is kept strictly separate.
        RETRACTED 2026-08-11 by adversarial review — this decision originally
        justified the group-set check by asserting that "aliasing by deletion or
        insertion NECESSARILY changes the ordinal domain's membership". THAT IS
        FALSE, and it was the sentence the whole conservatism rule rested on. A
        deletion PAIRED WITH a same-kind insertion in the same region leaves the
        group's site_key set byte-identical, so the check passes and a FALSE
        `discharged` is produced — the delete-instead-of-fix reward hack this
        rule exists to prevent. The group-set check is therefore a NECESSARY but
        NOT SUFFICIENT condition, and on its own it does not make `discharged`
        a certainty claim. Sound matching needs CONTENT corroboration (hashing
        the operator's local context so a replaced operator cannot inherit a
        predecessor's identity) rather than a positional ordinal plus a
        population check. See the limitations field; the implementation is held
        in draft until this is resolved.
      limitations: >
        FOUND BY ADVERSARIAL REVIEW 2026-08-11 (all reproduced; the
        implementation is in draft, nothing shipped):
        (1) CARDINALITY-PRESERVING DELETION defeats the group-set check — delete
            the open operator and append a same-kind safe one, and the site set
            is unchanged, yielding a false `discharged`. This falsifies the
            rationale's central claim (see above).
        (2) `body_shape_hash` is the WHOLE function identity in the no-name /
            no-export case, so two structurally identical functions share
            site/group keys — deleting a whole function carrying an obligation
            reports `discharged`. Conversely ANY opcode edit in such a function
            moves every key in it, so for stripped modules `discharged` is
            unreachable for the canonical fix shape (insert a guard / replace a
            `local.get` with a constant). Mitigation direction: never claim
            `discharged` when the function identity came from the shape-hash
            fallback — degrade to `uncertain`.
        (3) OBLIGATION LAUNDERING: wrapping the site in a typed `block`/`if`
            routes it through `havoc_region`, which emits no trap check, no gap
            and no advisory when the write set is empty and the region contains
            no call — so a LIVE obligation disappears and reads as
            `removed-with-code`. Root cause is a pre-existing FEAT-040/046
            reporting hole, tracked separately; the adjudicator must treat
            "absent from a function that degraded or gained a havoc region" as
            `uncertain`.
        (4) `regressed` is FABRICATED on a byte-identical module: `site_key`
            excludes the code, so an open div-by-zero and a proven
            signed-overflow at one `i32.div_s` share a site key, putting it in
            the proven set. Self-comparison returns contradictory `still-open`
            and `regressed` verdicts under one id with an invented before-code.
            The proven-safe advisory does not record WHICH trap kind it proves,
            which is the underlying data gap.
        (5) NEW obligations produce NO verdict at all (only sites that
            previously carried a proven fact are checked), so a fault introduced
            where nothing was flagged before passes the gate clean. This is the
            blindest direction for an autonomous agent.
        (6) `obligation_id` is not unique, against this decision's own claim: two
            ProvenSafe trap kinds at one pc both use code `proven-safe`, and the
            shape-hash collision duplicates ids across functions.
        PRE-EXISTING RESIDUAL, disclosed from the start: a pure REORDERING of two
        same-kind operators within one region preserves the group's site_key set
        while swapping which site each key denotes (each op takes the other's
        ordinal). The group-set check cannot see it, so that edit shape can still
        mis-attribute a verdict. It is an unusual edit, its consequence is a
        wrong verdict rather than an unsound analysis, and closing it would need
        content corroboration beyond the key (e.g. hashing the operator's local
        context) — deferred, and named here so a consumer is not surprised.
        Consequence for consumers: a `discharged` verdict is evidence, not proof,
        under a same-kind reordering; `uncertain` is the honest default whenever
        the domain moved.
    links:
      - type: satisfies
        target: REQ-021
      - type: traces-to
        target: FEAT-065
      - type: traces-to
        target: DD-020

  - id: DD-022
    type: design-decision
    title: "Dogfood the adjudicator in OBSERVATION MODE, and publish the uncertain fraction rather than the discharge count"
    status: proposed
    description: >
      Two coupled decisions taken on 2026-08-20, after adversarial review found
      six wrong-verdict paths in the FEAT-065 adjudicator (scry#122) and DD-021's
      central rationale was retracted in place.

      DECISION 1 — MEASURE BEFORE REWORKING. Run the REFUTED adjudicator over
      scry's own commit history (FEAT-073) before implementing any of scry#122's
      nine work items, and let the observed distribution order them.
      Alternative rejected: fix all nine, then dogfood. Rejected because nine
      fixes guessed at in the dark is how the first implementation was built, and
      because scry's own history is a better adversary than any fixture we would
      write — it contains real deletions, real same-kind insertions and real
      renames at 6,191-obligation scale. Four vacuous oracles were written in
      this project during August 2026; every one passed a fixture chosen by the
      same person who wrote the code. Real history is not chosen.

      DECISION 2 — OBSERVATION MODE IS STRUCTURAL, NOT PROCEDURAL. The harness
      exits 0 unconditionally and stamps scry#122 into every artifact it writes.
      Alternative rejected: run it as a gate with a generous threshold. Rejected
      because an adjudicator that can wrongly report `discharged` is worse than
      none — an agent optimising against the verdict finds the cheapest exploit
      (delete the code) before it finds a fix — and a threshold makes that
      exploit merely quieter. A comment saying "do not gate on this" is a
      convention; a function that cannot return non-zero is a property.

      DECISION 3 — THE PUBLISHED HEADLINE IS THE ADJUDICABLE FRACTION. While
      scry#122 is open, the delta view (FEAT-072) renders "of M obligations, K
      adjudicable, N uncertain" and NO discharge count, enforced by a test that
      greps the rendered page.
      Alternative rejected: publish discharges with a caveat paragraph. Rejected
      because the dashboard is public, the standing bar is that every public
      claim survives Conrad Watt, and a caveat does not travel — the number gets
      quoted, the paragraph does not. The uncertain fraction is the one figure
      the refutation did not undermine, and it is also the more useful one: it
      states how far the matcher can be trusted. When REQ-021 closes, the
      discharge count is UN-SUPPRESSED rather than re-implemented, so the
      constraint carries no rework cost.

      SEPARATION OF CONCERNS (recorded because it was nearly conflated): scale
      does not substitute for adversarial reading. The six findings came from
      reading, not from volume, and a 6,191-obligation run producing plausible
      numbers has exactly the shape of the vacuous oracles. FEAT-073 measures
      WHICH failures occur; REQ-021's adversarial acceptance bar establishes
      THAT each is fixed. Both are required; neither is evidence for the other.
    tags: [ai-agent, dogfood, honesty, observability, v3.3]
    fields:
      decision: >
        (1) Run the REFUTED adjudicator over scry's own commit history and let
        the observed verdict distribution ORDER scry#122's nine work items,
        before implementing any of them.
        (2) Enforce observation mode STRUCTURALLY — the harness cannot return
        non-zero — rather than by a comment asking readers not to gate on it.
        (3) Publish the ORDINAL-STABLE FRACTION and suppress the discharge
        count entirely while scry#122 is open, enforced by a test that greps the
        rendered page — which must also assert the LIMITATION is disclosed, not
        merely that the over-claim is absent.
        CORRECTED TWICE IN DRAFTING, and the second correction matters more than
        the first.
        (a) It first said "K adjudicable", which over-claims: nothing here
        certifies that a site can be adjudicated.
        (b) It was then changed to "K provably ALIAS-FREE", justified by
        `ObligationId.v: survivor_inherits_deleted_identity` needing a same-kind
        sibling that a singleton ordinal domain does not have. THAT IS ALSO
        WRONG, and it is wrong in the same way DD-021 was. It reasons from the
        one theorem that happens to be proven rather than from what aliasing is;
        a proof of ONE sufficient condition does not enumerate them.
        The counterexample, found before publication and now pinned as
        `feat072_region_shift_is_not_certified_as_identity_held`: `group_key`
        hashes the region PATH, and a path is a sibling index at its depth.
        Delete a whole region and its later siblings renumber, so a surviving
        region moves into the deleted region's path and its sole operator
        inherits the entire key — while BOTH domains remain singletons, so the
        ordinal check sees nothing. An obligation removed by deleting its region
        is then indistinguishable from one that changed state.
        The claim is therefore named for its SCOPE: `OrdinalStable` excludes
        sibling-ORDINAL donation and nothing else. It is a filter that says which
        rows to look at first, never a warrant that a change belongs to a site.
        RECORDED AS A PATTERN, because this is now the third instance: every
        attempt to certify identity from the KEYS ALONE has failed, at three
        different levels — the ordinal (DD-021), the region path (here), and the
        function ident (scry#123). The keys are a good address and a bad proof.
        Corroboration has to come from CONTENT.
      rationale: >
        ALTERNATIVE REJECTED for (1) — fix all nine items, then dogfood.
        Nine fixes guessed at in the dark is exactly how the first
        implementation was built. scry's own history is a better adversary than
        any fixture we would write: it holds real deletions, real same-kind
        insertions and real renames at 6,191-obligation scale. Four vacuous
        oracles were written in this project during August 2026 and every one
        passed a fixture chosen by whoever wrote the code. Real history is not
        chosen.
        ALTERNATIVE REJECTED for (2) — run it as a gate with a generous
        threshold. An adjudicator that can wrongly report `discharged` is worse
        than no adjudicator: an agent optimising against the verdict finds the
        cheapest exploit (delete the code) before it finds a fix, and a
        threshold only makes that exploit quieter. A comment is a convention; a
        function that cannot fail is a property.
        ALTERNATIVE REJECTED for (3) — publish discharges with a caveat
        paragraph. The dashboard is public and the standing bar is that every
        claim survives Conrad Watt. A caveat does not travel: the number gets
        quoted, the paragraph does not. The uncertain fraction is both the one
        figure the refutation did not undermine and the more useful one, since
        it states how far the matcher can be trusted. When REQ-021 closes the
        discharge count is UN-SUPPRESSED rather than re-implemented, so the
        constraint carries no rework cost.
      limitations: >
        Scale does not substitute for adversarial reading, and this decision
        must not be read as claiming it does. The six findings came from
        reading, not from volume, and a 6,191-obligation run producing
        plausible numbers has precisely the shape of the four vacuous oracles.
        FEAT-073 measures WHICH failures occur; REQ-021's adversarial
        acceptance bar establishes THAT each is fixed. Both are required and
        neither is evidence for the other.
        The harness also samples only scry's own coding style — a Rust/LLVM
        Wasm producer. Edit shapes common in hand-written or other-toolchain
        Wasm may be absent from the sample, so an UNOBSERVED failure path is
        not a refuted one, only an unmeasured one.
    links:
      - type: satisfies
        target: REQ-020
      - type: traces-to
        target: FEAT-072
      - type: traces-to
        target: FEAT-073
      - type: traces-to
        target: DD-021
