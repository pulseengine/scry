name: CI

# scry CI — extracted from the witness/spar pattern. No untrusted
# input is used in any `run:` block; all references are to vetted
# env vars or hardcoded literal strings, so the GHActions workflow-
# injection risk surface is empty.
#
# Job split is built around the gates scry needs:
#   * Cargo gates (fmt, clippy, test) on the Rust source.
#       — fmt:    cargo fmt --check on the whole workspace.
#       — clippy: real `cargo clippy --package scry-host-tests
#                 --all-targets -- -D warnings` (FEAT-001 AC#3).
#       — test:   bazel-builds //:scry first to produce the composed
#                 `bazel-bin/scry.wasm`, then runs the host wasmtime
#                 harness via `cargo test --package scry-host-tests`.
#   * Rivet validate on the typed-artifact graph.
#   * Spar parse on the AADL architecture model.
#   * WIT round-trip on each crate's wit/ via wasm-tools.
#   * Bazel build of the composed component (//:scry).
#   * wasm-tools validate on the built bazel-bin/scry.wasm.
#
# Required status checks (scry#130, enforced 2026-08-27). The ruleset
# `temper-default-branch-protection` now requires ALL TEN jobs of this
# workflow before a PR can merge: Format, Clippy, Test, Bazel build
# (//:scry), MC/DC (witness), cargo-deny, Doc claims (claim-check),
# Rivet artifact validation, WIT round-trip, AADL model (spar parse).
# Until then it required NOTHING — this comment claimed three were
# required and none were, so "merged green" rested on whoever merged
# remembering to look.
#
# `Rivet artifact delta` is deliberately NOT required: it lives in
# rivet-delta.yml, which is PATH-FILTERED (artifacts/**, rivet.yaml, …).
# A required check that never reports on a code-only PR blocks that PR
# forever. Any job added here is required only once its name exists on
# every PR — add it to the ruleset AFTER it has merged to main, never
# before, or every open PR deadlocks.
#
# AND THAT WAS NOT SUFFICIENT EITHER, learned by doing it twice. A PR opened
# BEFORE the job existed still does not have it, so it can never report and is
# blocked forever -- when #167 added two jobs and they were required, PRs #168
# and #169 each showed 11 checks with 0 of the 2 and would have deadlocked.
# Worse, landing the job while its required-checks.txt entry arrived in a
# SEPARATE PR left main AND every open PR red until that follow-up merged.
#
# So the file entry now ships WITH the job, and the gate ENFORCES that:
# check-required-checks.py fails a PR that adds a requirable job which is not
# in required-checks.txt. The procedure is:
#   1. in the SAME PR: add the job here AND to .github/required-checks.txt
#   2. after it merges: add the context to the ruleset (instant, via the API)
#   3. REBASE EVERY OPEN PR, or it can never satisfy the new check
# There is no window in which main is red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # scry's wasm-component crates (wasm-lattice, scry-analyzer)
      # depend on Bazel-injected bindings that don't exist on the
      # cargo path; `cargo clippy --workspace --target wasm32-wasip2`
      # cannot resolve them. Linting on the wasm side happens during
      # the bazel-build job below (rustc -W warnings is wired in
      # there).
      #
      # On the cargo path we lint only the native host harness
      # (scry-host-tests). `--all-targets` picks up tests/, examples/,
      # and benches/ in addition to the lib stub; `-D warnings`
      # promotes clippy to a hard gate per the witness/spar pattern.
      - name: cargo clippy --package scry-host-tests
        run: cargo clippy --package scry-host-tests --all-targets -- -D warnings
      # FEAT-002: the pure meld<->scry boundary crate also lints on the
      # cargo path (it compiles natively as well as to wasm32-wasip2).
      - name: cargo clippy --package scry-sai-provenance
        run: cargo clippy --package scry-sai-provenance --all-targets -- -D warnings
      # FEAT-009: the pure security-label (taint) lattice crate also
      # lints on the cargo path (it compiles natively as well as to
      # wasm32-wasip2, where wasm-lattice's WIT label-* exports delegate
      # to it).
      - name: cargo clippy --package scry-sai-taint
        run: cargo clippy --package scry-sai-taint --all-targets -- -D warnings
      # FEAT-010: the pure octagon relational-domain crate also lints on
      # the cargo path (it compiles natively as well as to
      # wasm32-wasip2, where wasm-lattice's WIT octagon-* exports
      # delegate to it).
      # scry#157: this job ran FOUR packages — the same four the Test job ran
      # before scry#141 widened it. Nine publishable crates were never linted,
      # and TWO of them had live errors on main that CI could not see:
      # scry-sai-bits (a doc line read as an unterminated blockquote) and
      # scry-sai-pentagon (two needless borrows). Both fixed alongside this.
      #
      # The lesson recorded on scry#157: fixing a coverage gap in ONE gate did
      # not fix the pattern. The clippy list sat three lines from the test list
      # and drifted independently, so the guard below now checks BOTH.
      - name: cargo clippy — analyzer core, viz, and the domain crates
        run: |
          cargo clippy -p scry-sai-core -p scry-sai-viz -p scry-sai-mcp -p scry-sai-interval \
                       -p scry-sai-bits -p scry-sai-float -p scry-sai-handle \
                       -p scry-sai-pentagon -p scry-sai-segment -p scry-sai-poly \
                       --all-targets -- -D warnings
      - name: cargo clippy --package scry-sai-octagon
        run: cargo clippy --package scry-sai-octagon --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Nix
        # Same Nix-toolchain rationale as the bazel-build job:
        # FEAT-012's Rocq toolchain is registered unconditionally
        # in MODULE.bazel and resolved during analysis even for
        # `bazel build //:scry`.
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-test-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', 'crates/**/BUILD.bazel', 'BUILD.bazel') }}
          restore-keys: |
            bazel-test-${{ runner.os }}-
      - name: bazel build //:scry
        # Produces the composed component at `bazel-bin/scry.wasm`
        # that the host harness loads via wasmtime. The harness
        # skips with a notice if the file is absent, so we materialize
        # it here BEFORE running cargo test.
        run: bazel build //:scry
      - name: cargo test --package scry-host-tests
        # SCRY_COMPONENT_PATH defaults to <workspace>/bazel-bin/scry.wasm
        # which is where `bazel build //:scry` puts the artifact. No
        # override needed in CI; the env var is supported for local
        # iteration where bazel-bin may be elsewhere.
        run: cargo test --package scry-host-tests -- --nocapture
      - name: cargo test --package scry-sai-provenance
        # FEAT-002: inline encode/decode/project unit tests for the
        # meld<->scry boundary crate (the same source the analyzer
        # links into the wasm component). The provenance round-trip is
        # additionally exercised through scry-host-tests/tests/provenance.rs.
        run: cargo test --package scry-sai-provenance -- --nocapture
      # FEAT-009: the security-label lattice kill-criterion — the label
      # lattice obeys its algebraic laws and forward propagation never
      # moves down the lattice (exhaustive over the height-1 lattice).
      # The same crate links into the wasm component; the host harness
      # (tests/taint.rs) re-exercises it on the cargo path.
      - name: cargo test --package scry-sai-taint
        run: cargo test --package scry-sai-taint -- --nocapture
      # FEAT-010: the octagon relational-domain kill-criterion — the DBM
      # operations are sound w.r.t. the concretization γ (closure
      # preserves γ; join over-approximates the union; meet =
      # intersection). The same crate links into the wasm component; the
      # host harness (tests/octagon.rs) re-exercises it on the cargo
      # path. The Rocq interval-soundness proof
      # (proofs/rocq/Soundness.v) is gated by the dedicated Rocq job.
      # scry#141: for most of this project's life the Test job ran FOUR
      # packages, and `scry-sai-core` — the analyzer itself — was not one of
      # them. 222 of 273 workspace tests (81%) never executed in CI, including
      # every domain crate except octagon, all of scry-viz, and every regression
      # oracle written for scry#121/#125/#126/#123.
      #
      # The Bazel `rust_test(name = "scry_analyze_core_test")` target exists but
      # no workflow invokes it: the only `bazel test` calls are for
      # //proofs/rocq/... and //proofs/verus/....
      #
      # Listed explicitly rather than `--workspace` on purpose: the workspace
      # contains wasm32 cdylib members that a host-target `cargo test` cannot
      # build (the reason PR #41 set default-members in the first place). Adding
      # a crate here is a deliberate act; a new crate is NOT covered until its
      # name appears below.
      # scry#141: gate the gate. Adding the crates above fixes the hole ONCE;
      # this stops it reopening. Every publishable crate in crates/ must appear
      # in a `cargo test` invocation in this workflow, or the job fails with the
      # crate named. Without it the next new domain crate silently joins the 81%
      # that were never tested — which is exactly how this happened.
      # scry#157: gate the gates. Every publishable crate must appear in BOTH
      # a `cargo test` and a `cargo clippy` invocation, or this fails naming the
      # crate AND which gate is missing it.
      #
      # Implemented as a YAML-PARSING script rather than inline grep/awk,
      # because three earlier text-scraping versions were vacuous in ways that
      # looked like they worked — most recently an awk range that chained across
      # the whole file, making the "tested" and "clippy" lists IDENTICAL so the
      # check could not detect the drift it exists for. The script carries a
      # `--self-test` that proves it distinguishes a good workflow from a bad
      # one, and is mutation-checked against this file in both directions.
      - name: Guard — every publishable crate is in BOTH gates
        run: |
          python3 tools/check-gate-coverage.py --self-test
          python3 tools/check-gate-coverage.py
      - name: cargo test — analyzer core, viz, and the domain crates
        run: |
          cargo test -p scry-sai-core -p scry-sai-viz -p scry-sai-mcp -p scry-sai-interval \
                     -p scry-sai-bits -p scry-sai-float -p scry-sai-handle \
                     -p scry-sai-pentagon -p scry-sai-segment -p scry-sai-poly \
                     -- --nocapture
      - name: cargo test --package scry-sai-octagon
        run: cargo test --package scry-sai-octagon -- --nocapture
      # FEAT-011: the full-stack Rocq soundness proofs (Soundness /
      # Region / CallGraph / Reachability) are gated by the dedicated
      # Rocq Formal Proofs job (bazel test //proofs/rocq/...).

  rivet-validate:
    name: Rivet artifact validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install rivet-cli
        run: cargo install --locked --git https://github.com/pulseengine/rivet rivet-cli
      - name: rivet validate
        run: rivet validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      # J-004: `rivet coverage` cannot tell a goal DECLARED `undeveloped: true`
      # (GSN's diamond) from one somebody forgot -- both render as uncovered at
      # the same 40%. J-004 records that the figure was investigated, but prose
      # is exactly what the next forgotten goal would hide behind. This gate
      # makes it mechanical: an unsupported goal must be declared, AND the
      # declaration must be justified. Ships a --self-test, run FIRST, which
      # includes the subtle case (flag present, no justification naming it) --
      # the shape a forgotten goal takes once someone quiets the report.
      # Two populations, ONE rule: an absent thing must be DECLARED and
      # JUSTIFIED. Safety goals were the first. The second is coverage rules
      # whose population is EMPTY -- rivet renders those as 100.0%, and four
      # of scry's seventeen currently do, because the `aspice` preset is
      # embedded and a project cannot subset its rules. Checked in BOTH
      # directions against .github/aspice-unmodelled-levels.txt so the file
      # cannot become an append-only suppression list.
      - name: Guard — an absent goal or coverage level is DECLARED and justified
        run: |
          python3 tools/check-undeveloped-goals.py --self-test
          python3 tools/check-undeveloped-goals.py

      # scry#187: v3.3.0's FEAT-064 is satisfiable only via FEAT-077/FEAT-087,
      # both scheduled v3.4.0 and both already shipped, so v3.3.0 cannot be cut
      # before v3.4.0. That inversion was found by an ad-hoc script run by hand
      # once. Typed `depends-on` links made it VISIBLE; this makes it CHECKED --
      # the same distinction FEAT-091 drew for commit trailers.
      #
      # A step on this job, not a job of its own: it reads the same artifacts and
      # the same PyYAML as the guard above, and this context is ALREADY required,
      # so the gate binds on merge with no ruleset edit to forget. A new required
      # context needs a post-merge admin step, which is the drift scry#130 was.
      #
      # The three known inversions are allowlisted WITH reasons and a stale entry
      # FAILS, so they double as a live test of the detection logic against real
      # artifacts -- inverting the comparison operator turns the gate red.
      - name: Guard — no release depends on one scheduled after it
        run: |
          python3 tools/check-release-ordering.py --self-test
          python3 tools/check-release-ordering.py

  # scry#161: the V-model's artifact side and the code side were never
  # connected -- rivet ships commit-to-artifact traceability and it shipped
  # here unconfigured, so `Broken refs` read 0 for want of any reference to
  # check. That counter is exactly what would have caught PR #159 merging with
  # a commit naming FEAT-086 before the artifact existed (#160).
  #
  # Its own job, not a step on the rivet job, so a traceability failure is
  # legible in the checks list rather than buried behind artifact validation.
  #
  # FORWARD-ONLY: scoped to origin/main..HEAD, so the 85 pre-existing orphan
  # commits never enter the gate. NOT `rivet commits --strict`, which also
  # promotes the repo-wide unimplemented-artifacts warning (Artifact coverage:
  # 1/257) that no pull request can satisfy.
  commit-traceability:
    name: Commit traceability (rivet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # origin/main..HEAD cannot resolve on a shallow clone.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install rivet-cli
        run: cargo install --locked --git https://github.com/pulseengine/rivet rivet-cli
      - name: Guard — every code commit links an artifact that RESOLVES
        run: |
          python3 tools/check-commit-trailers.py --self-test
          python3 tools/check-commit-trailers.py

  # scry#130 follow-up. The required-check setting was fixed on 2026-08-27;
  # this exists so it cannot silently rot back. Three ways it rots: a job is
  # ADDED and never required (scry#130 returning one job at a time, invisible
  # because the PR still goes green); a job is RENAMED (the stale context can
  # never report, so every PR deadlocks); or the ruleset is RESET — it is named
  # `temper-default-branch-protection`, so something else may regenerate it.
  #
  # Needs `administration: read` to see the ruleset, and full history to read
  # ci.yml as it exists on main — a job new in THIS PR is reported as pending,
  # not failed, because requiring it before it merges deadlocks every other
  # open PR.
  required-checks-drift:
    name: Required checks track CI jobs (scry#130)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      # --against-file, NOT the live ruleset: a workflow's GITHUB_TOKEN cannot
      # read rulesets (`administration` is not a grantable Actions scope, and a
      # workflow requesting it is rejected wholesale — the run fails with zero
      # jobs and no log, which reads like an outage rather than a syntax
      # error). So CI gates on .github/required-checks.txt, which catches the
      # rot WE cause: a job added or renamed without updating the file. A
      # ruleset RESET is invisible to anything in-repo and needs the live mode,
      # run with admin credentials.
      - name: Guard — every requirable CI job is in required-checks.txt
        run: |
          python3 tools/check-required-checks.py --self-test
          python3 tools/check-required-checks.py --against-file

  # A README is a claim about the system — the same species as a requirement,
  # gated the same way. `claim-check` re-derives every load-bearing doc claim
  # (version, admit-free proof count, published-crate count, WrapAdd.v, the
  # scoped-soundness wording) from live source and fails the build on drift —
  # so the status section can't silently rot ~40 versions again (issue #97).
  claim-check:
    name: Doc claims (claim-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: claim-check claims.yaml
        run: python3 tools/claim-check.py claims.yaml

  spar-parse:
    name: AADL model (spar parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install spar
        # spar's CLI binary lives in the `spar` package (the
        # crates/spar-cli directory of the workspace) and installs as
        # the `spar` binary on $PATH.
        run: cargo install --locked --git https://github.com/pulseengine/spar spar
      - name: spar parse spar/scry.aadl
        run: spar parse spar/scry.aadl

  wit-validate:
    name: WIT round-trip (wasm-tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools
      - name: WIT round-trip — wasm-lattice
        run: wasm-tools component wit crates/wasm-lattice/wit/wasm-lattice.wit > /dev/null
      - name: WIT syntax check — scry-analyzer
        run: |
          # wasm-tools component wit reports parse errors before
          # cross-package resolution; full type-check requires
          # Bazel's deps wiring (covered by the bazel-build job).
          # Here we only check the file parses syntactically and
          # has the expected package header.
          wasm-tools component wit crates/scry-analyzer/wit/scry.wit 2>&1 | head -50 || true
          grep -q '^package pulseengine:scry@' crates/scry-analyzer/wit/scry.wit

  bazel-build:
    name: Bazel build (//:scry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        # FEAT-012: scry's MODULE.bazel registers the Rocq toolchain
        # unconditionally (mirroring synth's pattern), which forces
        # Bazel to resolve `@rocq_toolchains` during analysis even
        # for `bazel build //:scry`. Install Nix so the resolution
        # succeeds. The actual Rocq build is exercised only by the
        # dedicated Rocq Formal Proofs job (rocq-proofs.yml).
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', 'crates/**/BUILD.bazel', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-
      - name: bazel build //:scry
        run: bazel build //:scry
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools
      - name: wasm-tools validate bazel-bin/scry.wasm
        run: wasm-tools validate bazel-bin/scry.wasm
      - name: wasm-tools print (header)
        run: wasm-tools print bazel-bin/scry.wasm | head -15
      # scry#152: the SHIPPED v3.2.6 component announced "scry 0.0.0". The
      # constant is env!("CARGO_PKG_VERSION"); rules_rust populates that from
      # the Bazel target's `version` attribute and defaults it to 0.0.0, and
      # Bazel builds the shipped artifact. FEAT-083 set the attribute and
      # claims.yaml pins it to the workspace version — but BOTH of those guard
      # the SOURCE. Only this step guards the ARTIFACT.
      #
      # The unit test cannot do it: the Bazel rust_test target is not invoked by
      # any workflow (scry#141's residual), and the assertion it replaced was
      # tautological anyway.
      - name: Guard — the built component carries the workspace version
        run: |
          set -euo pipefail
          WS=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "workspace version: $WS"
          # -a is load-bearing: scry.wasm is BINARY, and without it grep
          # reports "no match" for a string that IS present — silently, and
          # differently between BSD and GNU grep. Verified against two real
          # artifacts before this shipped; the version without -a failed BOTH
          # the fixed and the broken component, i.e. it was vacuous.
          if ! grep -qaF "$WS" bazel-bin/scry.wasm; then
            echo "::error::built component does not contain the workspace version $WS"
            exit 1
          fi
          if grep -qaF "0.0.0" bazel-bin/scry.wasm; then
            echo "::error::built component contains the rules_rust default 0.0.0 — a BUILD.bazel target is missing its version attribute (scry#152)"
            exit 1
          fi
          echo "OK — built component carries $WS and not the 0.0.0 default"
      - name: Upload composed component as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scry-wasm-component
          path: bazel-bin/scry.wasm
          if-no-files-found: error
          retention-days: 14

  deny:
    name: cargo-deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo deny check
        run: cargo deny check --hide-inclusion-graph

  mcdc:
    name: MC/DC (witness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # FEAT-014 rollout: the witness MC/DC pipeline runs on every change over
    # the REAL analyzer core (crates/scry-analyze-core, driven by
    # crates/scry-mcdc), so a code change that drops a proved condition turns
    # the build red — REQ-010 is a live oracle, not a one-shot release
    # artifact. The job also publishes the static truth-table visualisation.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      # witness lives in a sibling repo (pulseengine/witness); pin the rev so
      # the coverage numbers are reproducible and the gate is deterministic.
      # Cache the two built binaries keyed by that rev so we don't rebuild
      # witness (~several min) on every run.
      - name: Cache witness binaries
        id: witness-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/witness
            ~/.cargo/bin/witness-viz
          key: witness-bins-${{ runner.os }}-6ff96e75a1b495aa165f1ee91abda3049fffe628
      - name: Install witness + witness-viz (pinned rev)
        if: steps.witness-cache.outputs.cache-hit != 'true'
        run: |
          REV=6ff96e75a1b495aa165f1ee91abda3049fffe628
          URL=https://github.com/pulseengine/witness.git
          cargo install --git "$URL" --rev "$REV" witness-mcdc
          cargo install --git "$URL" --rev "$REV" witness-mcdc-viz
      - name: Run MC/DC gate (witness pipeline + baseline assertion + viz)
        run: ./crates/scry-mcdc/mcdc-gate.sh
        env:
          MCDC_SITE_DIR: ${{ github.workspace }}/mcdc-viz-site
      - name: Upload MC/DC truth-table visualisation
        uses: actions/upload-artifact@v4
        with:
          name: scry-mcdc-viz
          path: ${{ github.workspace }}/mcdc-viz-site
          if-no-files-found: error
          retention-days: 14
      # FEAT-025 dogfood: run scry on its OWN compiled module (the analyzer
      # core, already built above as scry_mcdc.wasm) and render the analysis
      # with scry-viz (FEAT-024). "scry visualizing scry." This is also a
      # robustness oracle — a panic / error analyzing a real, large,
      # compiler-emitted module turns the build red, where the tiny fixtures
      # cannot reach.
      # FEAT-031 (FEAT-025 slice-2): a LIVE robustness GATE — analyze scry's own
      # module and assert the result is structurally well-formed (no inverted
      # interval, 64-hex sha, gapless function metadata, sorted reachable set).
      # A violation is a scry bug and turns the build red (exit 5). This runs
      # before the render so a malformed result fails loudly, not silently.
      - name: Dogfood gate — scry-viz check on scry's own module (FEAT-031)
        run: |
          cargo run --release -p scry-sai-viz -- check \
            crates/scry-mcdc/target/wasm32-wasip1/release/scry_mcdc.wasm
      - name: Dogfood — scry-viz on scry's own module (FEAT-025)
        run: |
          cargo run --release -p scry-sai-viz -- \
            crates/scry-mcdc/target/wasm32-wasip1/release/scry_mcdc.wasm \
            -o "${{ github.workspace }}/scry-self-analysis.html" \
            --title "scry analyzing scry (scry_mcdc.wasm)"
      - name: Upload scry self-analysis
        uses: actions/upload-artifact@v4
        with:
          name: scry-self-analysis
          path: ${{ github.workspace }}/scry-self-analysis.html
          if-no-files-found: error
          retention-days: 14
      # FEAT-073 self-adjudication harness — OBSERVATION MODE.
      #
      # FEAT-025 (above) dogfoods scry on its own module at ONE commit. This
      # extends the same instrument across TIME: build scry_mcdc.wasm at the
      # last few commits and compare consecutive pairs BY STABLE OBLIGATION
      # IDENTITY (FEAT-064/072).
      #
      # It DOES NOT GATE, and that is deliberate, not an oversight (DD-022).
      # The adjudicator this would drive was refuted in review (scry#122): an
      # adjudicator that can wrongly report a fix is worse than none, because
      # the cheapest way for an agent to satisfy it is to delete the code. So
      # the harness reports and never judges — `continue-on-error` is belt to
      # the script's braces, which exits 0 unconditionally by construction.
      #
      # This already paid for itself: its first run surfaced scry#123 (43-45%
      # of function identities churn per build via the Rust symbol
      # disambiguator), a defect no fixture suite could have found because it
      # lives in the toolchain's output rather than in scry's logic.
      #
      # It graduates to a gate only when REQ-021 closes.
      - name: Self-adjudication harness (FEAT-073, observation only — never gates)
        continue-on-error: true
        run: |
          git fetch --deepen=5 origin "$GITHUB_SHA" 2>/dev/null || true
          bash scripts/self-history.sh 3 "${{ github.workspace }}/self-history"
      - name: Upload self-history observation
        uses: actions/upload-artifact@v4
        with:
          name: scry-self-history
          # if-no-files-found: warn — an observation that produced nothing is a
          # fact to report, not a build failure. `error` here would turn the
          # non-gating harness into a gate through the back door.
          if-no-files-found: warn
          path: ${{ github.workspace }}/self-history
          retention-days: 14
